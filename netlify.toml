# Web build. Production runs the strict content check, so it fails while any
# question or guide is still a draft. Deploy previews allow drafts and show a banner.
[build]
  base = "app"
  publish = "dist"
  command = "npm run build:web"
  # The site is built from app/ but also from content/ and tools/ at the repo root. Netlify's default check only
  # looks at app/, so it skipped deploys that changed only content (like approving listings). Build when any of
  # them changed. (Runs in app/; exit 0 skips the build.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../content ../tools ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm run build:web:preview"

[context.branch-deploy]
  command = "npm run build:web:preview"

# The service worker must never be served stale, or updates would not reach installed copies.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
