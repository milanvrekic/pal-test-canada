# Spot the mistake: each scene shows one handling mistake. Everything else in the scene is done correctly,
# so the wrong options describe things that are fine. Scenes live in content/drills/scenes/<scene>.svg and
# are generated by tools/scenes/scenes.py.
- id: spot-finger
  course: cfsc
  scene: finger
  alt: "A man in a green jacket at a range bench holds a scoped bolt-action rifle with the bolt pulled back, his right index finger inside the trigger guard."
  question: "What is wrong here?"
  options: ["The trigger finger is inside the trigger guard", "The bolt is drawn back and the action is open", "The muzzle is pointed downrange toward the berm", "The other hand is supporting the fore-end"]
  answer: 0
  explanation: "Keep your trigger finger off the trigger and out of the trigger guard, especially when you pick a firearm up. Lay it straight along the side of the receiver instead."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: &ok {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: spot-pass-closed
  course: cfsc
  scene: pass-closed
  alt: "Two men in caps, shooting glasses and ear muffs on a range; one hands an over-and-under shotgun, closed and pointed straight up, to the other."
  question: "What is wrong here?"
  options: ["The shotgun is being handed over with the action closed", "The muzzle is pointed up and away from both people", "Both people are wearing eye and ear protection", "Both people keep their fingers away from the trigger"]
  answer: 0
  explanation: "Pass or accept only open and unloaded firearms. Break the shotgun open and PROVE it safe before handing it over, and the person receiving it proves it safe again."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: *ok
- id: spot-muzzle-sweep
  course: cfsc
  scene: muzzle-sweep
  alt: "Three shooters on an outdoor firing line, each at a wooden bench, with targets in front of a dirt berm."
  question: "What is wrong on this firing line?"
  options: ["The middle shooter's rifle is pointed at the next shooter", "The two outer shooters' rifles are pointed downrange", "Each shooter is standing behind their own bench", "The targets are set up in front of the backstop berm"]
  answer: 0
  explanation: "On the range the muzzle must always be pointed downrange. Turn your head to talk, never the firearm, and keep it pointed in a safe direction the whole time."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.3. Safety procedures on approved range", page: "148"}
  review: *ok
- id: spot-fence
  course: cfsc
  scene: fence
  alt: "A hunter in a green jacket stepping up onto a barbed-wire fence in an autumn field, holding a scoped rifle."
  question: "This hunter is alone. What is wrong here?"
  options: ["He is climbing the fence while holding the rifle", "His rifle's muzzle is pointed up, away from his body", "He is crossing between two fence posts"]
  answer: 0
  explanation: "When crossing a fence alone, unload the firearm and place it flat on the ground under the fence with the action open and the muzzle pointed away from where you cross. Then cross."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: *ok
- id: spot-pistol-unload
  course: crfsc
  scene: pistol-unload
  alt: "A semi-automatic pistol lying on a range bench with its slide locked back, beside a shooting bag and ear muffs."
  question: "This pistol has been set down as unloaded. What is wrong here?"
  options: ["A cartridge is still in the chamber", "The slide is locked back so the chamber can be seen", "The pistol is lying flat on the bench, not held", "Nobody's finger is near the trigger"]
  answer: 0
  explanation: "Unloading is not done until you have looked. Remove the magazine, pull the slide back to eject the cartridge from the chamber, then look into the chamber and magazine well to prove the pistol is empty."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8.1. Semi-automatic unloading procedure", page: "278"}
  review: *ok
- id: spot-wall-display
  course: cfsc
  scene: wall-display
  alt: "A scoped bolt-action rifle on two wooden wall pegs with a red trigger lock, above a small shelf holding an open box of cartridges."
  question: "This rifle is displayed at home. What is wrong here?"
  options: ["Its ammunition is displayed right beside the rifle", "A trigger lock is fitted through the trigger guard", "The rifle is resting level on two wall pegs", "The rifle hangs above the shelf, not on it"]
  answer: 0
  explanation: "A displayed firearm must not be displayed with, or within easy access to, ammunition that can be fired from it. Store the ammunition locked up elsewhere."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.4. Display", page: "201"}
  law_checked_on: 2026-11-22  # SOR/98-209 s. 8(c), last amended 2012-11-30
  review: *ok
