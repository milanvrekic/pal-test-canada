- id: cfsc-handling-201
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Where may you load a firearm or handle a loaded firearm?"
  options: ["Anywhere on your own property, as long as you are alone", "Anywhere outside city limits, away from roads", "Only in a place where it is lawful to discharge it", "Anywhere at all, as long as the safety is on"]
  answer: 2
  explanation: "Having or firing a firearm is against the law in some places, and loading or handling one there may also be an offence. Load a firearm or handle a loaded one only where it is lawful to discharge it."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.6. Handling", page: "205"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
- id: cfsc-handling-202
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Where should a firearm be placed when it is in a vehicle?"
  options: ["On the dashboard, where the driver can keep an eye on it the whole time", "In a secure position where it can't slide or be stepped on", "Across a passenger's lap, so it is always under control", "Leaning against a seat with the muzzle pointing upward"]
  answer: 1
  explanation: "A firearm in a vehicle must be placed in a secure position where it will not be dislodged or stepped on. In the handbook's example, a dog jumped onto a loaded shotgun lying loose in a boat, and it fired."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.5. Safe handling of firearms in vehicles", page: "152"}
