- id: cfsc-misfire-201
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "What is a primer pop, also called a squib load?"
  options: ["A cartridge that fires a moment after the trigger is pulled", "A cartridge with no gunpowder, so only the primer fires", "A cartridge loaded with too much powder", "A primer that falls out of the case"]
  answer: 1
  explanation: "A primer pop or squib load happens when a cartridge has no gunpowder. The primer fires without the usual noise or recoil and may push the bullet into the barrel, where it can lodge. Firing another bullet could then rupture the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
- id: cfsc-misfire-202
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "After a click and no shot, why must you not take the cartridge out of the chamber right away?"
  options: ["It may be a hang fire, and a case that fires outside the chamber can burst", "The extractor and the chamber can be too hot to touch right after", "The primer can be struck again and reused if you wait", "The action of most firearms locks for 60 seconds after a misfire"]
  answer: 0
  explanation: "A hang fire is a delayed fire. If the cartridge is removed from the chamber and then fires, the explosive rupture of the case can cause injury. Wait 60 seconds with the muzzle pointed in a safe direction before opening the action."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
- id: cfsc-misfire-203
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "A cartridge is jammed in the chamber of your rifle. What does the handbook advise?"
  options: ["Fire another round to clear it", "Tap the butt on the ground until it comes loose", "Push it out from the muzzle end with a cleaning rod right away, while it's warm", "Consult a qualified person or gunsmith on clearing it safely"]
  answer: 3
  explanation: "A firearm jammed with a cartridge or shell in the chamber can be a hazard and may cause serious injury if not dealt with properly. Consult a qualified person or gunsmith on how to clear it in the safest way."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.11. Firearm malfunctions", page: "92"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
