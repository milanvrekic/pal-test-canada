  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Why protect the trigger and safety while carrying a firearm through brush?"
  options: ["So the bluing on the action doesn't get scratched by branches", "So you can fire faster if game appears in front of you", "So rain and snow don't get into the action", "A twig could catch the trigger, push the safety off or swing the muzzle"]
  answer: 3
  explanation: "A twig or branch may catch the trigger, put the safety off or swing the muzzle around, so protect the trigger and safety under all circumstances while carrying."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
- id: cfsc-handling-204
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You have to cross ice or rocky, uneven ground with your firearm. What does the handbook advise?"
  options: ["Unload it if you can, and plan how to control the muzzle if you fall", "Carry it over your shoulder so that both hands are free to steady you", "Keep it loaded with the safety on, in case game appears", "Run across quickly to spend less time on the ice"]
  answer: 0
  explanation: "You can slip and fall and cause a discharge. Plan how to protect the firearm and control its direction if you fall and, if possible, unload it before crossing uneven ground or ice."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
