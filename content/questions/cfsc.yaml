  course: cfsc
  topic: handling
  type: multiple-choice
  question: "When you are carrying a firearm outdoors, when should the safety be on?"
  options: ["Only when you cross a fence", "Only when other people are near you", "Until you are ready to use the firearm", "Only while the firearm is in its case or being carried in a vehicle"]
  answer: 2
  explanation: "Control the muzzle direction at all times and keep the safety on until you are ready to use the firearm. Never rely on it, though: safeties can fail."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: TBD, reviewed_on: TBD, status: draft}
