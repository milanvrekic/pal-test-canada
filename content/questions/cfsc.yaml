- id: cfsc-display-001
  course: cfsc
  topic: display
  type: multiple-choice
  question: "You want to display a non-restricted rifle on a wall rack at home. Which set of conditions meets the rules?"
  options: ["Loaded, with the safety on", "Unloaded, with a secure locking device, and not displayed with or near its ammunition", "Unloaded, with a secure locking device, and a box of its ammunition on the shelf just below", "Unloaded, with the bolt closed so dust stays out"]
  answer: 1
  explanation: "A non-restricted firearm may be displayed only if it is unloaded, made inoperable with a secure locking device or kept in a securely locked container or room, and not displayed with or within easy access to ammunition for it."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.4. Display", page: "201"}
