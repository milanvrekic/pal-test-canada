# CFSC sample. Question, answer and explanation reviewed by the instructor on 2026-11-22.
# Law questions were checked against current regulations the same day.
# Pages cite the printed page of the 2014 (5th ed.) handbook, PS99-2/2-1-2014, which matches the PDF page.
# Written from the handbook topics, never from memory of the real exam.
- id: cfsc-acts-001
  course: cfsc
  topic: vital-four-acts
  type: multiple-choice
  question: "What does the A in ACTS stand for?"
  options: ["Always keep the safety on when carrying", "Assume every firearm is loaded", "Aim only at your target", "Ask before handling a firearm"]
  answer: 1
  explanation: "ACTS: Assume every firearm is loaded, Control the muzzle direction at all times, Trigger finger off the trigger and out of the trigger guard, See that the firearm is unloaded."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: &reviewed {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: cfsc-acts-002
  course: cfsc
  topic: vital-four-acts
  type: multiple-choice
  question: "What does the C in ACTS stand for?"
  options: ["Check the chamber", "Control the muzzle direction at all times", "Clear the action", "Carry the firearm unloaded and cased in the field"]
  answer: 1
  explanation: "C is Control the muzzle direction at all times. A firearm pointed in a safe direction cannot hurt anyone even if it fires."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: *reviewed
- id: cfsc-acts-003
  course: cfsc
  topic: vital-four-acts
  type: multiple-choice
  question: "Under ACTS, where should your trigger finger be until you have decided to fire?"
  options: ["Resting lightly on the trigger", "Inside the trigger guard but not touching the trigger", "Off the trigger and outside the trigger guard", "On the safety"]
  answer: 2
  explanation: "T is Trigger finger must be kept off the trigger and out of the trigger guard. Resting it along the frame or stock keeps it clear."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: *reviewed
- id: cfsc-acts-004
  course: cfsc
  topic: vital-four-acts
  type: multiple-choice
  question: "The S in ACTS tells you to see that the firearm is unloaded. Which procedure do you use to do that?"
  options: ["PROVE", "Engaging the safety", "Dry firing", "Removing the scope"]
  answer: 0
  explanation: "S is See that the firearm is unloaded: PROVE it safe. PROVE is the step-by-step check that the firearm holds no ammunition and the bore is clear."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: *reviewed
- id: cfsc-prove-001
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "What is the first step of PROVE?"
  options: ["Remove all ammunition from the chamber and the magazine", "Point the firearm in the safest available direction", "Put the safety on", "Open the action"]
  answer: 1
  explanation: "P comes first: Point the firearm in the safest available direction. Every later step is done with the muzzle under control."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-prove-002
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "What does the R in PROVE stand for?"
  options: ["Release the safety", "Rack the action twice", "Remove all ammunition", "Return the firearm to storage"]
  answer: 2
  explanation: "R is Remove all ammunition, from the magazine and the chamber."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-prove-003
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "What does the O in PROVE stand for?"
  options: ["Open the magazine", "Observe the chamber", "Oil the action", "Operate the safety catch"]
  answer: 1
  explanation: "O is Observe the chamber. You look, and feel if needed, to confirm no cartridge is in it."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-prove-004
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "What does the V in PROVE stand for?"
  options: ["Verify the feeding path", "Verify the serial number", "View the target", "Vent the barrel"]
  answer: 0
  explanation: "V is Verify the feeding path: check that no cartridge remains in the magazine or anywhere it could feed into the chamber."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-prove-005
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "What does the E in PROVE stand for, and why does it matter?"
  options: ["Engage the safety, so the firearm cannot fire", "Eject the magazine, so it cannot feed", "Examine the bore, because an obstruction can burst the barrel", "Engage the action lock, so the bolt cannot close on a cartridge"]
  answer: 2
  explanation: "E is Examine the bore. Mud, snow, a cleaning patch or a lodged bullet in the barrel can cause it to bulge or burst when fired."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-prove-006
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "You PROVE a rifle safe, set it down and leave the room. When you come back, what must you do before handling it?"
  options: ["Nothing, it was already proven safe", "Check only that the safety is on", "PROVE it safe again", "Ask if anyone touched it"]
  answer: 2
  explanation: "A firearm that has been out of your direct control must be proven safe again. You cannot know what happened to it while you were away."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe Pointers", page: "22"}
  review: *reviewed
- id: cfsc-ammo-001
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "How do you confirm a cartridge is the correct one for a firearm?"
  options: ["It fits into the chamber", "The box looks like the one you used before", "The head stamp on the cartridge matches the data stamp on the barrel", "The bullet looks the same diameter as the muzzle when you hold them together"]
  answer: 2
  explanation: "Match the head stamp on the cartridge to the data stamp on the firearm's barrel. A cartridge that fits is not necessarily the right one."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.2. Calibre", page: "66"}
  review: *reviewed
- id: cfsc-ammo-002
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Which list names the four components of a rifle cartridge?"
  options: ["Case, primer, powder, bullet", "Hull, wad, shot, crimp", "Case, primer, wad, slug", "Jacket, core, rim, neck"]
  answer: 0
  explanation: "A cartridge is made of the case, the primer, the powder and the bullet."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.3. Cartridges", page: "69"}
  review: *reviewed
- id: cfsc-ammo-003
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Where is the priming compound in a rimfire cartridge?"
  options: ["In a separate primer pressed into the centre of the case head", "Inside the rim of the case", "Mixed through the powder", "In the base of the bullet"]
  answer: 1
  explanation: "In rimfire ammunition the priming compound sits inside the rim of the case. Centre-fire ammunition has a separate primer in the centre of the case head."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.3. Cartridges: types of cartridges", page: "71"}
  review: *reviewed
- id: cfsc-ammo-004
  course: cfsc
  topic: ammunition
  type: true-false
  question: "Carrying 12-gauge and 20-gauge shells in the same pocket is a safety hazard."
  options: ["True", "False"]
  answer: 0
  explanation: "A 20-gauge shell can slide past the chamber of a 12-gauge shotgun and lodge in the barrel. A 12-gauge shell loaded behind it can then burst the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.7. Shotgun shells", page: "87"}
  review: *reviewed
- id: cfsc-misfire-001
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "What is a hang fire?"
  options: ["A cartridge that fires with far more recoil and noise than a normal cartridge would", "A delay between the firing pin striking the primer and the cartridge firing", "A cartridge that will not chamber", "A bullet that lodges in the barrel"]
  answer: 1
  explanation: "A hang fire is a delayed ignition. The cartridge may still fire some time after the trigger is pulled, which is why the muzzle must stay pointed in a safe direction."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: *reviewed
- id: cfsc-misfire-002
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "You pull the trigger and hear only a click. What should you do first?"
  options: ["Open the action right away to look at the cartridge and see what went wrong", "Keep the muzzle pointed in a safe direction and wait 60 seconds", "Pull the trigger again", "Turn the firearm to look down the muzzle"]
  answer: 1
  explanation: "Treat every failure to fire as a possible hang fire. Keep the firearm pointed in a safe direction and wait 60 seconds before opening the action."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: *reviewed
- id: cfsc-misfire-003
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "A shot sounds much weaker than normal and has little recoil. What should you do?"
  options: ["Fire again to clear the barrel", "Stop, PROVE the firearm safe and check the bore for an obstruction", "Switch to a different brand of ammunition and continue with the rest of the string", "Tap the muzzle on the ground"]
  answer: 1
  explanation: "A weak report can mean the bullet or wad is lodged in the barrel. Firing another round behind an obstruction can burst the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: *reviewed
- id: cfsc-actions-001
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "Which action is opened by lifting a handle and pulling it to the rear?"
  options: ["Lever action", "Pump action", "Bolt action", "Break action"]
  answer: 2
  explanation: "A bolt action is opened by lifting the bolt handle and drawing the bolt back."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.7. Single shot: bolt action unloading", page: "119"}
  review: *reviewed
- id: cfsc-actions-002
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "How is a pump action operated?"
  options: ["By swinging a lever under the receiver", "By sliding the fore-end back and forward", "By pressing a release so the barrel hinges down", "By gas from the fired cartridge"]
  answer: 1
  explanation: "A pump action is cycled by sliding the fore-end to the rear and then forward."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.1. Action types", page: "100"}
  review: *reviewed
- id: cfsc-actions-003
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "What does a semi-automatic firearm do each time the trigger is pulled?"
  options: ["Fires continuously until the trigger is released", "Fires one cartridge and loads the next one automatically", "Fires one cartridge and must then be cycled by hand to load another", "Fires two cartridges"]
  answer: 1
  explanation: "A semi-automatic fires one cartridge per trigger pull and uses the energy of that shot to load the next. It can be ready to fire again immediately."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.1. Action types", page: "100"}
  review: *reviewed
- id: cfsc-handling-001
  course: cfsc
  topic: handling
  type: true-false
  question: "When the safety is on, a firearm cannot fire."
  options: ["True", "False"]
  answer: 1
  explanation: "A safety is a mechanical device and can fail. It never replaces muzzle control and keeping your finger off the trigger."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.3. Be sure before you shoot", page: "60"}
  review: *reviewed
- id: cfsc-handling-002
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "What is the safe way to hand a firearm to another person?"
  options: ["Hand it over with the safety on", "PROVE it safe and pass it with the action open", "Pass it muzzle first so they can grip the barrel", "Close the action so nothing falls out"]
  answer: 1
  explanation: "PROVE the firearm safe and hand it over with the action open and the muzzle controlled. The person receiving it should PROVE it safe too."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: *reviewed
- id: cfsc-handling-003
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You are alone and need to cross a fence with your rifle. What do you do?"
  options: ["Climb over holding the rifle with the safety on", "Lean the loaded rifle against the fence and climb over", "Unload, open the action, place the rifle under the fence with the muzzle pointing away, then cross away from the muzzle", "Sling the loaded rifle on your back and climb"]
  answer: 2
  explanation: "Unload and leave the action open, lay the firearm down on the far side with the muzzle pointing away from where you will cross, then cross."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: *reviewed
- id: cfsc-field-001
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Before you fire at a target, what must you be sure of?"
  options: ["That the target is within 100 metres", "Your target and what lies beyond it", "That the wind is calm", "That your safety has been tested"]
  answer: 1
  explanation: "Identify the target beyond any doubt and know what is behind it. A bullet can pass through or miss the target and travel a long way."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.4. Be sure of your target and beyond", page: "60"}
  review: *reviewed
- id: cfsc-muzzle-001
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "What propellant may be used in a muzzleloader?"
  options: ["Any smokeless powder", "Only black powder or a black powder substitute made for muzzleloaders", "Shotgun powder in reduced amounts", "Whatever powder is recommended for a modern cartridge of the same calibre"]
  answer: 1
  explanation: "Use only black powder or a black powder substitute, and never smokeless powder in a muzzleloader: it produces far higher pressure and can destroy the firearm. Some modern firearms are made to handle smokeless powder, so always follow the manufacturer's instructions on powder type and loads."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2. Muzzleloading firearms", page: "37, 42"}
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: cfsc-storage-001
  course: cfsc
  topic: storage
  type: multiple-choice
  question: "Which of these meets the storage rules for a non-restricted firearm?"
  options: ["Loaded, in a locked cabinet", "Unloaded, with a trigger lock on, and ammunition not within easy reach", "Unloaded, on an open rack in the hallway, with its ammunition on the shelf beside it", "Unloaded, under a bed with the safety on"]
  answer: 1
  explanation: "A non-restricted firearm must be stored unloaded and either made inoperable with a secure locking device, have its bolt removed, or be locked in a sturdy container or room. Ammunition must not be readily accessible unless it is locked up."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.3. Storage", page: "199"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: cfsc-storage-002
  course: cfsc
  topic: storage
  type: true-false
  question: "Ammunition may be stored with a non-restricted firearm if both are in a securely locked container that cannot be easily broken into."
  options: ["True", "False"]
  answer: 0
  explanation: "Ammunition must not be readily accessible to the firearm unless it is stored, with or without the firearm, in a securely locked container that cannot readily be broken open."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.3. Storage", page: "199"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: cfsc-transport-001
  course: cfsc
  topic: transport
  type: multiple-choice
  question: "You leave a non-restricted rifle in an unattended car that has a trunk. How must it be left?"
  options: ["Loaded but with the safety on, in the trunk", "Unloaded, on the back seat under a coat, doors unlocked", "Unloaded, in the locked trunk", "Unloaded, on the dashboard so it is visible"]
  answer: 2
  explanation: "An unattended non-restricted firearm must be unloaded and locked in the trunk or a similar compartment. If the vehicle has no trunk, it must be out of sight inside the locked vehicle."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.5. Transportation", page: "203"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: cfsc-class-001
  course: cfsc
  topic: classification
  type: multiple-choice
  question: "What are the three classes of firearms in Canadian law?"
  options: ["Hunting, sporting and military", "Non-restricted, restricted and prohibited", "Rifles, shotguns and handguns", "Manual-action, semi-automatic and fully automatic"]
  answer: 1
  explanation: "Firearms are classed as non-restricted, restricted or prohibited. The class decides which licence privileges and rules apply."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.4. Classification of firearms", page: "54"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: cfsc-licence-001
  course: cfsc
  topic: licensing
  type: multiple-choice
  question: "How often must a Possession and Acquisition Licence be renewed?"
  options: ["Every year", "Every 3 years", "Every 5 years", "Never, it is valid for life"]
  answer: 2
  explanation: "A PAL is valid for five years and must be renewed before it expires to keep possessing firearms lawfully."
  source: {handbook_edition: "2014 (5th ed.)", section: "Responsibilities of the firearms owner", page: TBD}
  law_checked_on: "2026-11-22"
  # Retired 2026-11-22: the handbook does not state how long a PAL is valid. Replaced by cfsc-licence-002.
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: retired}

- id: cfsc-licence-002
  course: cfsc
  topic: licensing
  type: multiple-choice
  question: "You hold no firearms licence and apply for your first PAL. What is the minimum waiting period before it can be issued?"
  options: ["7 days", "14 days", "28 days", "60 days"]
  answer: 2
  explanation: "There is a minimum 28-day waiting period for a PAL, unless the applicant already holds a valid Possession Only Licence, PAL or Minors Possession Licence."
  source: {handbook_edition: "2014 (5th ed.)", section: "Appendix I: Firearms licences", page: "338"}
  law_checked_on: "2026-11-22"
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}

# Batch 2, drafted from the 2014 handbook and reviewed by the instructor on 2026-11-22.
- id: cfsc-parts-001
  course: cfsc
  topic: parts
  type: multiple-choice
  question: "What are the three major parts of a modern firearm?"
  options: ["Barrel, action and stock", "Barrel, magazine and sights", "Trigger, hammer and firing pin", "Stock, scope and sling"]
  answer: 0
  explanation: "Modern firearms consist of three major parts: the barrel, the action and the stock."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.1. Major firearms parts", page: "47"}
  review: &reviewed2 {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: cfsc-parts-002
  course: cfsc
  topic: parts
  type: multiple-choice
  question: "Manufacturers often mark the cartridge a firearm is made for on its barrel. What is this marking called?"
  options: ["The head stamp", "The data stamp", "The proof mark", "The serial number"]
  answer: 1
  explanation: "Cartridge information marked on the barrel is the data stamp. The head stamp is the marking on the cartridge itself."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.1.1. Barrel", page: "48"}
  review: *reviewed2
- id: cfsc-parts-003
  course: cfsc
  topic: parts
  type: multiple-choice
  question: "In the firing sequence, what ignites the powder?"
  options: ["The firing pin touching the powder directly", "The flame from the primer", "Friction from the bullet moving down the barrel", "The trigger creating a spark"]
  answer: 1
  explanation: "The trigger releases the firing mechanism, the firing pin strikes the primer, and the primer's flame ignites the powder. The expanding gas drives the bullet or shot down the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.2. The firing sequence", page: "51"}
  review: *reviewed2
- id: cfsc-ammo-005
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "What does rifling in a barrel do?"
  options: ["Makes the bullet spin so it is stable in flight and more accurate", "Spreads the shot into a wider pattern", "Lets the same barrel safely fire several different calibres of ammunition", "Slows the bullet down to reduce recoil"]
  answer: 0
  explanation: "Rifling is the spiral grooves and lands inside the barrel. It spins the bullet so it stays stable in flight, which makes it more accurate."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.1. Rifling", page: "64"}
  review: *reviewed2
- id: cfsc-ammo-006
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "What does the calibre of a rifled firearm measure?"
  options: ["The length of the barrel", "The diameter of the bore", "The weight of the bullet", "The amount of powder in the cartridge"]
  answer: 1
  explanation: "Calibre is a measurement of bore diameter, in thousandths of an inch or in millimetres. Always check the data stamp for the exact ammunition name."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.2. Calibre", page: "64"}
  review: *reviewed2
- id: cfsc-ammo-007
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "How is the gauge of a shotgun determined?"
  options: ["By the bore diameter measured in thousandths of an inch, as rifle calibre is", "By the length of the shell in inches", "By the number of lead balls the size of the bore that weigh one pound", "By the number of pellets in a standard shell"]
  answer: 2
  explanation: "If 12 lead balls the diameter of the bore weigh one pound, the shotgun is 12 gauge. The .410 is the exception: it is measured as a calibre."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.5. Shotgun gauge", page: "75"}
  review: *reviewed2
- id: cfsc-ammo-008
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Which shotgun choke produces the tightest shot pattern?"
  options: ["Full", "Modified", "Improved cylinder", "Cylinder bore"]
  answer: 0
  explanation: "The choke narrows the muzzle to control the spread of shot. Full choke gives the tightest pattern; cylinder bore, which has no narrowing, gives the most open."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.6. Choke", page: "77"}
  review: *reviewed2
- id: cfsc-ammo-009
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "A shotgun shell has five components, one more than a rifle cartridge. Which component does the shell have that the cartridge does not?"
  options: ["The wad", "The primer", "The powder charge", "The firing pin"]
  answer: 0
  explanation: "The wad separates the powder charge from the shot or slug, seals the gas behind the charge, and separates the shot from the inside of the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.7. Shotgun shells", page: "80"}
  review: *reviewed2
- id: cfsc-ammo-010
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "According to the handbook, how far can some rifles fire a bullet?"
  options: ["About 500 metres", "About 1 kilometre", "About 2 kilometres", "More than 5 kilometres"]
  answer: 3
  explanation: "Some rifles can fire bullets further than five kilometres, and shotguns can fire shot more than the length of a football field. Know the dangerous range of your firearm and ammunition."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.8. Ballistics", page: "89"}
  review: *reviewed2
- id: cfsc-ammo-011
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "What is the safest way to carry ammunition?"
  options: ["Loose in a jacket pocket", "In its original container", "In one box with ammunition for your other firearms", "Loaded in the firearm"]
  answer: 1
  explanation: "Ammunition is most safely carried in its original container. Carry only ammunition for the firearm you are using."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.12. Ammunition precautions and legislation", page: "94"}
  review: *reviewed2
- id: cfsc-actions-004
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "You are handed a firearm you have never used, and you cannot work out how to open the action. What should you do?"
  options: ["Pull the trigger while pointing it in a safe direction to see if that releases the action", "Force the action open", "Stop and check the owner's manual or ask someone who knows that firearm well", "Hand it back closed and say nothing"]
  answer: 2
  explanation: "Do not touch any firearm unless you know how to handle it safely. Consult the owner's manual or a person who knows that firearm well."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.3. Action releases", page: "107"}
  review: *reviewed2
- id: cfsc-range-001
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "For maximum hearing protection when shooting, what does the handbook recommend?"
  options: ["Foam earplugs only", "Headphone-type protectors only, since plugs add nothing", "Both earplugs and headphone-type protectors", "Cotton in the ears"]
  answer: 2
  explanation: "A gunshot is about as loud as a jet engine taking off at close range. For maximum protection, wear earplugs and headphone-type protectors together."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.2. Personal safety protection", page: "146"}
  review: *reviewed2
- id: cfsc-range-002
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "At an approved range, when must the action of your firearm be open?"
  options: ["Only during a cease-fire", "At all times, except when actually shooting", "Only while walking to and from the firing line", "Only when the range officer asks"]
  answer: 1
  explanation: "Range rules normally require the action to be open at all times except when actually shooting."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.3. Safety procedures on approved range", page: "148"}
  review: *reviewed2
- id: cfsc-range-003
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "The range officer calls \"cease-fire\". What do you do?"
  options: ["Finish the shot you are on, then load for the next string", "Stop firing, unload, open the action, lay the firearm down pointing downrange, and step back behind the cease-fire line", "Keep the firearm loaded and in your hands, pointed downrange", "Walk forward to check your target"]
  answer: 1
  explanation: "On cease-fire all firing stops at once. Firearms are unloaded, actions opened, and firearms laid down with muzzles downrange. Shooters step behind the cease-fire line and handle nothing until the next command."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.3. Safety procedures on approved range", page: "148"}
  review: *reviewed2
- id: cfsc-handling-004
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "When may you have a loaded firearm in or on a vehicle?"
  options: ["Whenever the safety is on", "When the vehicle is parked", "Only where you are allowed to shoot from that vehicle", "When the firearm is in a soft case with the safety on and the action closed"]
  answer: 2
  explanation: "Never have a loaded firearm in or on any vehicle unless you are allowed to shoot from it. Unload before getting in, and load only after getting out."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.5. Safe handling of firearms in vehicles", page: "152"}
  review: *reviewed2
- id: cfsc-field-002
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "You see movement in the distance and are not sure what it is. Why should you not look at it through your rifle's scope?"
  options: ["The scope may lose its zero", "You would be pointing the rifle at whatever it is", "The scope is not powerful enough to identify game at that range", "It is legal only during daylight"]
  answer: 1
  explanation: "Looking through a mounted scope points the firearm at what you are looking at, which may be a person. Use binoculars to identify people, animals or objects."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: *reviewed2
- id: cfsc-field-003
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Before a group hunt starts, what should everyone agree on?"
  options: ["Who gets the first shot", "Each shooter's safe zone of fire", "Which ammunition brand to use", "How many shots each person may take"]
  answer: 1
  explanation: "Agree on the area each shooter will cover so everyone has a defined safe zone of fire. As the group moves, always know exactly where your partners are."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.7. Shooting or hunting with a group", page: "156"}
  review: *reviewed2
- id: cfsc-care-001
  course: cfsc
  topic: care
  type: multiple-choice
  question: "Why can too much oil on a firearm be dangerous in cold weather?"
  options: ["It makes the firearm too slippery to hold", "It can freeze safeties and firing parts in the firing position, and the firearm may fire as it thaws", "It changes the calibre of the barrel", "It makes the ammunition corrode"]
  answer: 1
  explanation: "Oil or moisture can freeze safeties and other firing mechanism parts in a firing position. When the firearm thaws later, it may fire."
  source: {handbook_edition: "2014 (5th ed.)", section: "9.2. Firearm cleaning", page: "181"}
  review: *reviewed2
- id: cfsc-resp-001
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "Your rifle is stolen from your home. Who must you report the theft to?"
  options: ["No one, if it is insured", "Only your insurance company, which then informs the police for you", "Your local police service and the Canadian Firearms Program", "The store where you bought it"]
  answer: 2
  explanation: "The Criminal Code requires owners to report the loss or theft of a firearm. Report it to your local police service and to the Canadian Firearms Program at 1-800-731-4000."
  source: {handbook_edition: "2014 (5th ed.)", section: "10.3. Firearms reported lost, missing or stolen", page: "190"}
  law_sensitive: true
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: cfsc-display-001
  course: cfsc
  topic: display
  type: multiple-choice
  question: "You want to display a non-restricted rifle on a wall rack at home. Which set of conditions meets the rules?"
  options: ["Loaded, with the safety on", "Unloaded, with a secure locking device, and not displayed with or near its ammunition", "Unloaded, with a secure locking device, and a box of its ammunition on the shelf just below", "Unloaded, with the bolt closed so dust stays out"]
  answer: 1
  explanation: "A non-restricted firearm may be displayed only if it is unloaded, made inoperable with a secure locking device or kept in a securely locked container or room, and not displayed with or within easy access to ammunition for it."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.4. Display", page: "201"}
  law_checked_on: "2026-11-22"
  review: *reviewed2

# Batch 3 (drafted 2026-11-22 from the 2014 handbook; approved by Milan Vrekic 2026-11-22)
- id: cfsc-handling-101
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Why should you never lean a loaded firearm against a vehicle, tree or wall?"
  options: ["It is harder for others to see it there", "The barrel can bend if left at an angle", "The finish can get scratched on rough bark", "It could fall over and fire"]
  answer: 3
  explanation: "Loaded firearms leaned against a vehicle, tree or wall can fall over and discharge. Unload first, and lay the firearm down or keep it in hand."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.2. Load a firearm only for actual use", page: "59"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-102
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You come to a ditch you need to jump while carrying your firearm. What does the handbook say?"
  options: ["Never jump a ditch with a loaded firearm", "Have a partner throw it to you once across", "Jump with the safety on and the muzzle up", "Toss the firearm across the ditch, then jump"]
  answer: 0
  explanation: "Never run, climb, cross an obstacle or jump a ditch with a loaded firearm, and never toss or drop a firearm across a ditch or fence. Unload, open the action, then cross."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.2. Load a firearm only for actual use", page: "59"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-101
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "At a firing range, when should you load your firearm?"
  options: ["Once at the shooting area and ready to shoot", "In the parking lot so you are ready at the line", "Before signing in, so the line moves faster", "Whenever the person beside you starts firing"]
  answer: 0
  explanation: "Load only when you have reached the shooting area and are ready to shoot, and completely unload before you leave the shooting area."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.2. Load a firearm only for actual use", page: "59"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-102
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Why should you never rely on a firearm's safety?"
  options: ["Safeties are fitted to restricted firearms only, not rifles", "The safety stops the trigger but not the hammer", "Safeties wear and can fail, and it may still fire", "Safeties only work when the firearm is cold"]
  answer: 2
  explanation: "Safeties wear down and may not work properly. A loaded firearm may fire even with the safety on, because all mechanical devices can fail."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.3. Be sure before you shoot", page: "60"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-101
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "You hear a rustle and see a patch of brown moving in the bush. What should you do?"
  options: ["Shoot quickly, since game seldom stays in view", "Fire at the movement as long as the hunting season is open", "Fire one shot low to see what it is", "Not shoot until you have positively identified it"]
  answer: 3
  explanation: "Positively identify your target before you shoot. Never fire at a movement, a colour, a sound or a shape. When in doubt, do not shoot."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.4. Be sure of your target and beyond", page: "60"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-102
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Why should you never shoot if the bullet could hit water or a hard, flat surface?"
  options: ["It damages the rifling of the barrel", "The bullet will stop dead on impact and sink without any trace", "The bullet or fragments can ricochet unpredictably", "It makes the shot much louder than normal"]
  answer: 2
  explanation: "Water and hard surfaces can make a bullet or its fragments ricochet in unsafe directions. Never shoot if your bullet may hit either."
  source: {handbook_edition: "2014 (5th ed.)", section: "4.2.4. Be sure of your target and beyond", page: "61"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-103
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Why should you not shoot at game standing on top of a hill?"
  options: ["Hilltops are always outside legal hunting areas", "The animal is more likely to run downhill", "Someone may be in the line of fire beyond it", "Shooting uphill always makes the bullet drop"]
  answer: 2
  explanation: "People or livestock may be in the line of fire over the hill. Always be sure of your target and what is beyond it."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-103
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "What should shooting glasses be made of?"
  options: ["Impact-resistant glass or polycarbonate, with side shields", "Thin plastic that fogs less in cold weather", "Any tinted sunglass lens, as long as it is dark", "Ordinary prescription glass, which is fine without side shields"]
  answer: 0
  explanation: "Wear safety glasses made of impact-resistant glass or polycarbonate plastic with side shields. They guard against ejected casings, fragments, debris and stray pellets."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.2.1. Sight protection", page: "146"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-104
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "You slip and fall while carrying a firearm. What should your first action be?"
  options: ["Let go of the firearm to break your fall", "Control the muzzle of the firearm", "Grab the trigger guard to hold on tight", "Put the safety on before anything else"]
  answer: 1
  explanation: "If you fall, your first action should be to control the muzzle. Plan ahead how you would protect the firearm and control its direction in a fall."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.2.3. Slips and falls", page: "147"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-105
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Why button your collar and sleeves when shooting?"
  options: ["Range rules require it for every shooter", "So loose cloth does not snag on the sights or the action as you aim", "So a hot ejected casing can't get in and make you flinch", "It keeps powder residue off your skin"]
  answer: 2
  explanation: "A hot ejected casing touching bare skin can make you flinch, and a sudden movement can lead to poor muzzle control or an unintentional discharge."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.2.3. Slips and falls", page: "147"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-106
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "Who can call a cease-fire at the range in an emergency?"
  options: ["Only the shooter who saw the problem first", "Anyone", "Only the Range Officer", "Only a licensed range member"]
  answer: 1
  explanation: "In an emergency, anyone can call a cease-fire."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.3.1. Additional range safety suggestions", page: "150"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-107
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "What does direct and immediate supervision of a shooter mean?"
  options: ["The supervisor checks in between each target", "The supervisor watches from behind the firing line", "The supervisor is within arm's reach at all times", "The supervisor is somewhere on the range grounds"]
  answer: 2
  explanation: "Direct and immediate supervision means the supervisor is within arm's reach of the shooter at all times while shooting is supervised."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.3.1. Additional range safety suggestions", page: "150"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-range-108
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "You are shooting a very smoky firearm, such as a black-powder rifle. Where should you set up?"
  options: ["Downwind of the other shooters on the line", "Right beside the Range Officer's station", "Upwind, so the smoke drifts over the others", "In the middle of the line, to share the smoke"]
  answer: 0
  explanation: "If firing particularly smoky firearms, shoot from downwind of other shooters on the firing line. Black-powder firearms are especially smoky."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.4. Range courtesy", page: "151"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-103
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Why take extra care when getting in or out of a vehicle with a firearm?"
  options: ["Slamming a vehicle door can switch the safety off", "The firearm can scratch the paint or seats", "Vehicles block the view of other hunters", "It is especially hard to control muzzle direction then"]
  answer: 3
  explanation: "It is especially difficult to control muzzle direction when entering or leaving vehicles, so take extra care to keep the muzzle in the safest available direction."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.5. Safe handling of firearms in vehicles", page: "152"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-104
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You are hunting alone from a pit or blind. How should you get in?"
  options: ["Lower it in by the sling, then climb in after it", "Hand the loaded firearm down first, muzzle up", "Climb in carrying the loaded firearm, as long as the safety is on", "Unload, place the firearm outside, get in, then bring it in"]
  answer: 3
  explanation: "Unload your firearm and place it outside before entering. Then enter and bring the unloaded firearm into the pit or blind after you."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-105
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Your group comes to a fence. How should you cross it?"
  options: ["One person holds the unloaded, open firearms while the others cross", "Everyone climbs over carrying their loaded firearms", "Each person leans their loaded firearm against a post, then climbs over", "The first across catches firearms tossed over to them"]
  answer: 0
  explanation: "In a group, one person should stand away from the crossing point and hold the unloaded, open firearms while the others cross."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-104
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "You laid your rifle on the ground for a few minutes. What should you check before using it?"
  options: ["That no dirt got into it, especially the muzzle", "That the scope is still set to the same magnification as before", "That the sling swivels are still tight", "That the stock is dry before you shoulder it"]
  answer: 0
  explanation: "Check your firearm for dirt if you lay it on the ground, especially the muzzle. An obstruction in the bore can burst the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.6. Safe handling of firearms outdoors", page: "153"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-105
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "When shooting or hunting in a group, what is a safe zone of fire?"
  options: ["Any direction in which no other hunter can be seen at the moment", "The 45 degrees either side of where the dogs run", "The space behind the group, away from the game", "The area each shooter agrees to cover, and fires into only"]
  answer: 3
  explanation: "Before starting, everyone agrees which area each shooter will cover. That is each person's safe zone of fire. Positions change as you move, so always know where your partners are."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.7.2. Safe zones of fire", page: "156"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-field-106
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "A few friends want to sight in their rifles in a field. What should they do first?"
  options: ["Have the best shot go first to check the range", "Load at the vehicles to save time at the line", "Appoint one person as the Range Officer", "Each pick a target and start when ready"]
  answer: 2
  explanation: "For an informal firing line, appoint someone as Range Officer to supervise, then set up a firing line, follow range commands and agree a safe shooting zone with a safe backstop."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.7.1. Informal firing line", page: "156"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-106
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Which carrying position gives you the best control of the firearm and muzzle?"
  options: ["The trail carry", "The two-hand or ready carry", "The shoulder carry with the muzzle up", "The sling carry"]
  answer: 1
  explanation: "The two-hand or ready carry is the safest carry. It gives the best control of the firearm and muzzle and lets you get into shooting position quickly."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.8. Carrying positions", page: "158"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-107
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Which carrying position is the least safe?"
  options: ["The two-hand or ready carry", "The cradle carry", "The shoulder carry", "The elbow or side carry"]
  answer: 2
  explanation: "The shoulder carry is the least safe: muzzle control is poor in a fall. It must not be used for loaded firearms or when others are with you."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.8. Carrying positions", page: "160"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-handling-108
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You use the cradle carry and a partner walks with you. Where should they walk?"
  options: ["On the side away from the muzzle", "Directly in front of you", "On the same side as the muzzle", "A few steps behind and to the muzzle side"]
  answer: 0
  explanation: "In the cradle carry the muzzle points to one side, so the other person has to walk on the opposite side of the muzzle."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.8. Carrying positions", page: "158"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-shooting-101
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "Which rifle shooting position is the steadiest?"
  options: ["Prone", "Standing", "Sitting", "Kneeling"]
  answer: 0
  explanation: "Prone is the steadiest position, good for accurate long shots when grass or brush doesn't block the view. Standing is the least stable."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.2.1. Rifles: Prone position", page: "168"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-shooting-102
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How should you work a shotgun trigger, compared with a rifle trigger?"
  options: ["Slap it quickly but not hard, instead of squeezing", "Squeeze it even more slowly and steadily than a rifle trigger", "Hold it back until the shot pattern lands", "Pull it hard so the shot isn't delayed"]
  answer: 0
  explanation: "Rifle triggers are squeezed slowly and steadily. Shotgun triggers are slapped, like striking a typewriter key: quickly, but not hard."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.4.3. Trigger control", page: "177"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-care-101
  course: cfsc
  topic: care
  type: multiple-choice
  question: "You fired older military surplus ammunition. Why clean the firearm right away?"
  options: ["Surplus powder can re-ignite in the barrel", "Some of it still contains corrosive chemicals", "It leaves more lead than modern ammunition", "It voids the warranty unless cleaned that day"]
  answer: 1
  explanation: "Modern primers and powders are non-corrosive, but some older military surplus ammunition still contains corrosive chemicals. Clean immediately after using it."
  source: {handbook_edition: "2014 (5th ed.)", section: "9.2. Firearm cleaning", page: "181"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-care-102
  course: cfsc
  topic: care
  type: multiple-choice
  question: "Where possible, which way should you clean a barrel?"
  options: ["Only from the muzzle, with the action closed", "From the breech toward the muzzle", "From the muzzle toward the breech", "From both ends, meeting in the middle"]
  answer: 1
  explanation: "Clean from the breech toward the muzzle when you can. If you must clean from the muzzle end, lock the breech open and avoid rubbing the rod on the muzzle."
  source: {handbook_edition: "2014 (5th ed.)", section: "9.2.1. Cleaning materials", page: "182"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-ammo-101
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Why shouldn't you wipe ammunition with an oily rag?"
  options: ["Oil changes the calibre stamped on the case", "Oil makes the cartridges too slippery to load", "Oil makes the powder burn faster and hotter", "Penetrating oils can damage the primers"]
  answer: 3
  explanation: "Primers are harmed by penetrating oils. Keep ammunition clean and dry, away from heat and long-term vibration."
  source: {handbook_edition: "2014 (5th ed.)", section: "9.2.3. Ammunition storage", page: "186"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-resp-101
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "A household you know seems headed for violence, and there are firearms in it. What does the handbook recommend?"
  options: ["Hide the ammunition but leave the firearms", "Remove the firearms, or at least notify the police", "Leave them where they are, since they are already locked up", "Wait to see whether things calm down first"]
  answer: 1
  explanation: "Go beyond safe storage: completely remove firearms from situations of potential violence. If that isn't possible, at least notify the police. You can also call 1-800-731-4000."
  source: {handbook_edition: "2014 (5th ed.)", section: "10.6. Social responsibilities and ethics", page: "193"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-resp-102
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "Is it an offence to point an unloaded firearm at another person without lawful excuse?"
  options: ["Yes, whether it is loaded or unloaded", "No, only a loaded firearm counts", "Only if the firearm is a restricted one", "Only if the other person is frightened"]
  answer: 0
  explanation: "Pointing a firearm at another person without lawful excuse is a Criminal Code offence whether the firearm is loaded or unloaded (subsections 87(1) and (2))."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: Other duties of firearms owners/users", page: "24"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-muzzle-101
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "How can you tell whether a muzzleloader's barrel already holds a charge?"
  options: ["Slide in a ramrod marked at the empty-bore depth", "Look down the barrel from the muzzle end with a flashlight", "Shake it and listen for loose powder", "Check whether the hammer is at full cock"]
  answer: 0
  explanation: "It is hard to tell if a muzzleloader is loaded. Experienced shooters mark the ramrod at the bore depth when empty; inserted, it shows whether there is a charge."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.1. Loading muzzleloaders", page: "39"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-prove-101
  course: cfsc
  topic: prove
  type: multiple-choice
  question: "When checking a barrel for obstructions, where should you look through it from, if you can?"
  options: ["From the muzzle end", "From the breech end", "From either end; it makes no difference", "From the side, through the ejection port"]
  answer: 1
  explanation: "Look through the barrel from the back or breech end whenever possible. Only look from the muzzle end once the firearm is unloaded, the action open and the chamber empty."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.4.2. Checking the barrel for obstructions", page: "110"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: cfsc-actions-101
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "On a lever action with an exposed hammer, which hammer position is considered safety on?"
  options: ["Half cock", "Any position, once the lever is closed", "Full cock", "Fully forward on the firing pin"]
  answer: 0
  explanation: "Half cock is considered safety on; full cock is safety off. With the hammer fully forward on the firing pin, a sharp blow to the hammer can fire the firearm."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.10. Lever-action repeaters", page: "129"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}

# Batch 4, drafted 2026-11-24 from the 2014 handbook; approved by Milan Vrekic 2026-11-24.
- id: cfsc-acts-101
  course: cfsc
  topic: vital-four-acts
  type: multiple-choice
  question: "According to the handbook, what is true whenever a firearm incident happens?"
  options: ["The firearm had a mechanical fault that nobody could have found", "At least one of the Vital Four ACTS was broken", "The safety was left off", "The ammunition was the wrong type"]
  answer: 1
  explanation: "The handbook says that any time you hear of a firearm incident, at least one of the Vital Four ACTS has been broken. Following all four every time is what prevents incidents."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "21"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-resp-103
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "You hold a firearms licence and move to a new home. How soon must you notify the Canadian Firearms Program of your new address?"
  options: ["Within 7 days", "Within 30 days", "Within 90 days", "When you next renew the licence"]
  answer: 1
  explanation: "A licence holder must notify the RCMP Canadian Firearms Program of a change of address within 30 days."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: Legal Responsibilities (Table 1)", page: "23"}
  law_sensitive: true
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-licence-101
  course: cfsc
  topic: licensing
  type: multiple-choice
  question: "Which firearms may the holder of a Possession and Acquisition Licence acquire?"
  options: ["Any firearm sold by a licensed dealer", "Only non-restricted rifles, never shotguns", "Only the classes of firearm the licence covers", "Any firearm, once it has been registered in the holder's own name"]
  answer: 2
  explanation: "A PAL holder may acquire only firearms of the class the licence is valid for."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: Legal Responsibilities (Table 1)", page: "23"}
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-muzzle-102
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Your muzzleloader fails to fire when you pull the trigger. What should you do?"
  options: ["Re-cock and try again straight away", "Look down the muzzle to check the charge, then re-prime and fire again without waiting any longer", "Pour in a little more powder", "Treat it as a hang fire and wait at least 60 seconds, muzzle in a safe direction"]
  answer: 3
  explanation: "Treat a muzzleloader misfire as a hang fire: the charge may still go off. Keep it pointed in a safe direction and wait at least 60 seconds."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.3. DOs and DON'Ts of muzzleloading", page: "44"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-muzzle-103
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "You want to load one barrel of a double-barrelled muzzleloader. What must you do first?"
  options: ["Remove the cap from the nipple of the other barrel", "Cock both hammers fully", "Load the other barrel with powder only, so that both are part charged", "Plug the other barrel with a patch"]
  answer: 0
  explanation: "Do not load one barrel of a double-barrelled muzzleloader unless the cap has been removed from the other barrel's nipple."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.3. DOs and DON'Ts of muzzleloading", page: "44"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-muzzle-104
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "How should the powder charge for a muzzleloader be measured?"
  options: ["By eye, straight from the powder can", "With the palm of your hand", "With a volumetric measure, never poured from the main container", "By filling the barrel until the powder reaches a mark scratched on the ramrod"]
  answer: 2
  explanation: "Always use a volumetric measure for the charge, and never pour powder directly from the main container into the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.1. Loading muzzleloaders", page: "42"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-muzzle-105
  course: cfsc
  topic: muzzleloaders
  type: true-false
  question: "For the safe-storage rules, a black-powder firearm with powder in the barrel but no ball counts as unloaded."
  options: ["True", "False"]
  answer: 1
  explanation: "False. Under the safe-storage regulations a black-powder firearm is considered loaded when powder, a ball, or both are in the barrel."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.1. Loading muzzleloaders", page: "42"}
  law_sensitive: true
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-muzzle-106
  course: cfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "How often should a black-powder firearm be cleaned?"
  options: ["Once a season", "After every firing session", "Only when accuracy drops", "Every 100 shots"]
  answer: 1
  explanation: "A black-powder firearm must be properly cleaned after every firing session. Black powder is very corrosive and attracts moisture, which causes rust."
  source: {handbook_edition: "2014 (5th ed.)", section: "2.2.2. Cleaning a muzzleloader", page: "43"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-handling-109
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "For safe handling, how does the handbook say all air guns should be treated?"
  options: ["As toys, if they are low-powered", "As firearms", "As firearms only when loaded", "As firearms only if they need a licence"]
  answer: 1
  explanation: "Many high-powered air guns are firearms under the Firearms Act, so for safe practices all air guns should be treated as firearms."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.4. Classification of firearms", page: "54"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-ammo-102
  course: cfsc
  topic: ammunition
  type: true-false
  question: "A .22 Magnum cartridge can be used in a rifle made for .22 Long Rifle cartridges."
  options: ["True", "False"]
  answer: 1
  explanation: "False. The .22 rim-fire comes in several versions, and the .22 Magnum is not interchangeable with the others. Use only the cartridge named on the firearm's data stamp."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.3.2. Types of cartridges", page: "71"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-ammo-103
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Some rim-fire cartridges have no cartridge name on the head stamp. How do you identify them?"
  options: ["By the colour of the bullet", "By the weight of the cartridge", "By trying them in the chamber to see which ones fit properly", "From the information on the ammunition box"]
  answer: 3
  explanation: "When a cartridge has no head stamp name, refer to the information on the box. If you are in any doubt about ammunition, have a qualified person check it."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.3.3. Cartridge names", page: "73"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-ammo-104
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Which shotgun bore is named by its calibre instead of a gauge?"
  options: ["The .410", "The 28", "The 20", "The 10"]
  answer: 0
  explanation: "The .410 is the exception to the gauge system: it is measured as a calibre."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.5. Shotgun gauge", page: "75"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-ammo-105
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Why must you never load a shotgun shell that is longer than the length marked on the barrel's data stamp?"
  options: ["The shot pattern becomes too wide", "The barrel may burst", "The shell will not eject", "The recoil becomes lighter"]
  answer: 1
  explanation: "Do not use shells longer than the data stamp allows: the barrel may burst. Chamber length refers to a fired shell, so an unfired shell can look shorter than it is."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.7.2. Shotgun shell types", page: "86"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-misfire-101
  course: cfsc
  topic: misfires
  type: multiple-choice
  question: "A cartridge misfired, and after waiting you have unloaded it safely. What do you do with it?"
  options: ["Reload it and try once more", "Put it back in the box with the others and use it another day", "Dispose of it properly and do not reuse it", "Save it for use in another firearm"]
  answer: 2
  explanation: "A misfired cartridge should not be reused. Dispose of it properly."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.10. Hazards", page: "92"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-ammo-106
  course: cfsc
  topic: ammunition
  type: multiple-choice
  question: "Why does the handbook recommend storing ammunition in a vented container?"
  options: ["An unvented container can create an explosive hazard in a fire", "Vents keep the primers lubricated", "Vents let you see how much ammunition is left without opening the container", "Vented containers are easier to lock"]
  answer: 0
  explanation: "Store ammunition in a cool, dry place, preferably in a vented container. In a fire, an unvented container can create an explosive hazard."
  source: {handbook_edition: "2014 (5th ed.)", section: "5.12. Ammunition precautions and legislation", page: "93"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-actions-102
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "Why is pointed centre-fire ammunition a hazard in most tubular magazines?"
  options: ["It is too long to feed", "It wears out the magazine spring much faster than round-nosed ammunition does", "It lowers the muzzle velocity", "A jolt can drive a bullet point into the primer of the cartridge ahead of it"]
  answer: 3
  explanation: "In a tubular magazine the cartridges sit nose to tail. A pointed bullet rests against the primer of the cartridge in front, and a jolt could set that primer off."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.8.2. Tubular magazine", page: "123"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-actions-103
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "How do you confirm that a tubular magazine is empty?"
  options: ["Shake the firearm and listen", "See or feel the magazine follower", "Count the cartridges you removed and compare with the capacity", "Check that the safety is on"]
  answer: 1
  explanation: "Always be sure you can see or feel the follower. If you cannot, a cartridge may still be in the magazine."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.8.2. Tubular magazine", page: "122"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-actions-104
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "Which action is sometimes called a slide or trombone action?"
  options: ["Lever action", "Bolt action", "Pump action", "Hinge action"]
  answer: 2
  explanation: "The pump action is sometimes called the slide or trombone action, because the fore-end of the stock is pumped back and forth to work the action."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.11. Pump-action repeaters", page: "133"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-actions-105
  course: cfsc
  topic: actions
  type: multiple-choice
  question: "Many lever actions have a trigger-block safety. What must happen before such a firearm will fire?"
  options: ["The hammer must be at half cock, with the lever left partly open", "The magazine must be full", "The lever must be fully squeezed against the stock", "The action must be partly open"]
  answer: 2
  explanation: "This type of lever action often will not fire unless the lever is fully squeezed against the stock, which depresses the trigger-block safety."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.10. Lever-action repeaters", page: "129"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-parts-101
  course: cfsc
  topic: parts
  type: multiple-choice
  question: "How does a safety stop a firearm from firing?"
  options: ["It removes the cartridge from the chamber and holds it in the magazine until needed", "It blocks one or more of the trigger, sear, hammer or firing pin", "It locks the magazine in place", "It closes the muzzle"]
  answer: 1
  explanation: "A safety blocks one or more parts of the firing mechanism: the trigger, sear, hammer or firing pin. It is a mechanical device and can fail, so never rely on it."
  source: {handbook_edition: "2014 (5th ed.)", section: "6.2. Safeties", page: "102"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-parts-102
  course: cfsc
  topic: parts
  type: multiple-choice
  question: "What does the action of a firearm do?"
  options: ["It aims the firearm", "It absorbs the recoil and steadies the firearm", "It spins the bullet", "It loads, fires and ejects the cartridge"]
  answer: 3
  explanation: "The action holds the parts that chamber the cartridge, fire it, and eject fired or unfired cartridges."
  source: {handbook_edition: "2014 (5th ed.)", section: "3.1.2. Action", page: "49"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-range-109
  course: cfsc
  topic: range-and-field
  type: multiple-choice
  question: "At the range you would like to pick up another shooter's firearm for a closer look. What should you do first?"
  options: ["Check that its action is open", "Ask the owner's permission", "Wait for a cease-fire", "Put on gloves"]
  answer: 1
  explanation: "Range courtesy: ask the owner's or shooter's permission before handling someone else's firearm."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.4. Range courtesy", page: "151"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-handling-110
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "Where should you avoid using the sling carry?"
  options: ["In dense bush", "On open ground", "On a marked trail", "At a range"]
  answer: 0
  explanation: "Do not use the sling carry in dense bush: the firearm may get caught in brush and be pulled off your shoulder, and debris may fall into the barrel. If you bend sharply forward, it is dangerous to anyone in front of you."
  source: {handbook_edition: "2014 (5th ed.)", section: "7.8. Carrying positions", page: "160"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-103
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "Which rifle shooting position is the least stable?"
  options: ["Prone", "Sitting", "Kneeling", "Standing"]
  answer: 3
  explanation: "Standing is the least stable of the four rifle positions (standing, kneeling, sitting and prone). Prone is the steadiest."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.2.1. Rifles", page: "165"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-104
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How is firing a shotgun at a moving target different from firing a rifle?"
  options: ["A shotgun is pointed at the target", "A shotgun is fired from the hip", "A shotgun is aimed more slowly", "A shotgun is fired with one eye closed"]
  answer: 0
  explanation: "Precise aiming matters less with a shotgun than with a rifle: you point it at the target. Stand like a boxer, feet apart, well balanced, arms and body free to swing."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.2.2. Shotguns", page: "169"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-105
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How can you find your master eye?"
  options: ["Read an eye chart with each eye", "Look at a distant object through a triangle made with your hands, then close each eye in turn", "Ask which hand you write with", "Close one eye at a time while reading small print at arm's length, and pick the eye that reads it faster"]
  answer: 1
  explanation: "Make a triangle with your hands and look at a distant object through it with both eyes open. Close each eye in turn: the eye that keeps the object centred is your master eye."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.4.1. Sight alignment", page: "175"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-106
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "When in your breathing should you release a rifle shot?"
  options: ["At the top of a deep breath", "While breathing in slowly", "In the natural pause after you breathe out", "Whenever the sights look right, however you are breathing"]
  answer: 2
  explanation: "Release the shot in the natural pause at the bottom of each exhale. It lasts about 2.5 seconds, and controlled breathing can lengthen it to about 8.5 seconds."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.4.2. Breathing as it relates to shot release", page: "175"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-107
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "What is follow-through?"
  options: ["Reloading as fast as you can", "Walking to the target after the shot", "Lowering the firearm the moment it fires, to see where the shot went", "Keeping your sight picture and position after the shot"]
  answer: 3
  explanation: "Follow-through means maintaining your sight picture and shooting position after the firearm discharges. Without it, the shot is more likely to be off target."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.4.4. Follow-through", page: "177"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-shooting-108
  course: cfsc
  topic: shooting-technique
  type: multiple-choice
  question: "Most shotguns have only a bead at the front. What acts as the rear sight?"
  options: ["The safety", "The shooter's eye", "The receiver screws", "The trigger guard"]
  answer: 1
  explanation: "Most shotguns have only a bead front sight, so the shooter's eye acts as the rear sight."
  source: {handbook_edition: "2014 (5th ed.)", section: "8.3. Aiming your firearm", page: "170"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-care-103
  course: cfsc
  topic: care
  type: multiple-choice
  question: "You cleaned and oiled your rifle after the last outing. What should you do before firing it again?"
  options: ["Add more oil to the bore", "Fire one cartridge to clear the oil", "Run a dry patch through the barrel", "Nothing: a film of oil protects the bore"]
  answer: 2
  explanation: "Before the next firing, run a dry patch through the barrel to remove the oil."
  source: {handbook_edition: "2014 (5th ed.)", section: "9.2.2. Cleaning procedures", page: "183"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-resp-104
  course: cfsc
  topic: responsibilities
  type: true-false
  question: "Some non-prescription drugs, such as allergy medicines, can affect the alertness and balance you need to handle a firearm safely."
  options: ["True", "False"]
  answer: 0
  explanation: "True. Never consume alcohol or drugs before or while handling firearms. Prescription and non-prescription drugs, including some allergy medicines, can affect alertness, the senses and balance."
  source: {handbook_edition: "2014 (5th ed.)", section: "10.6. Social responsibilities and ethics", page: "193"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-resp-105
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "What does the handbook say about the key or combination to your firearm storage?"
  options: ["Keep it taped to the cabinet", "Give a copy to each family member", "Do not leave it lying around", "Write it on the trigger lock"]
  answer: 2
  explanation: "Do not leave the key or combination lying around or give it to others, and do not let it become widely known that you have firearms. Making access difficult can delay an impulse to do harm."
  source: {handbook_edition: "2014 (5th ed.)", section: "10.4. Secure storage", page: "190"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-resp-106
  course: cfsc
  topic: responsibilities
  type: multiple-choice
  question: "You want to shoot on land that belongs to someone else. What does the handbook tell you to do?"
  options: ["Get the owner's permission first", "Shoot only if no signs are posted", "Stay within sight of a road", "Go when the owner is away"]
  answer: 0
  explanation: "Always get permission before shooting on someone else's property."
  source: {handbook_edition: "2014 (5th ed.)", section: "10.6. Social responsibilities and ethics", page: "193"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-transport-101
  course: cfsc
  topic: transport
  type: multiple-choice
  question: "You must leave a non-restricted rifle in an unattended vehicle that has no trunk. How must it be left?"
  options: ["Unloaded, on the seat with the doors unlocked", "Unloaded and out of sight, inside the locked vehicle", "Loaded, with the safety on, under a blanket", "Unloaded and in plain view on the seat, so police can see it"]
  answer: 1
  explanation: "With no trunk or similar compartment, the firearm must be unloaded and out of sight, and the vehicle (or the part holding the firearm) must be locked."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.5. Transportation", page: "203"}
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-transport-102
  course: cfsc
  topic: transport
  type: multiple-choice
  question: "When may a loaded muzzleloader be transported between hunting sites?"
  options: ["Never", "When the hammer is at half cock and the muzzle is pointed up", "When it is in a locked case", "When its percussion cap or flint has been removed"]
  answer: 3
  explanation: "Non-restricted firearms must be transported unloaded. The exception is a muzzleloader moved between hunting sites with its firing cap or flint removed. Provincial rules may add to this."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.5. Transportation", page: "203"}
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: cfsc-handling-111
  course: cfsc
  topic: handling
  type: multiple-choice
  question: "You have just bought a rifle and are carrying it out of the shop to your car. What does the handbook recommend?"
  options: ["Carry it over your shoulder", "Carry it in a case or opaque container", "Carry it with the action closed and the muzzle down", "Carry it by the barrel"]
  answer: 1
  explanation: "The handbook recommends carrying firearms in a case or opaque container when you leave a seller in a public place, so the firearm is not on display."
  source: {handbook_edition: "2014 (5th ed.)", section: "11.6. Handling", page: "205"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}

# Batch 5 (drafted 2026-11-27 from the 2014 handbook, PS99-2/2-1-2014; every page checked against the PDF page text).
# Awaiting instructor review. Law questions also need law_checked_on.
- id: cfsc-storage-201
  course: cfsc
  topic: storage
  type: multiple-choice
  question: "Your non-restricted rifle is unloaded. Which of these does NOT, on its own, meet the storage rules?"
  options: ["Fitting it with a secure locking device", "Removing its bolt or bolt carrier", "Keeping it in a closed but unlocked hall closet", "Locking it in an opaque cabinet that is hard to break into"]
  answer: 2
