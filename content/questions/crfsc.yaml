- id: crfsc-care-106
  course: crfsc
  topic: care
  type: multiple-choice
  question: "Your handgun has been in storage for a long time. What should you do before using it?"
  options: ["Fire a test shot", "Oil the bore heavily", "Dry fire it several times", "Clean it thoroughly"]
  answer: 3
  explanation: "Any firearm that has been stored for a long time must be cleaned thoroughly before use. The same applies when it has been exposed to moisture or dirt."
