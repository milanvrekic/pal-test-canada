# CRFSC sample. Question, answer and explanation reviewed by the instructor on 2026-11-22.
# Law questions were checked against current regulations the same day.
# Pages cite the printed page of the 2014 (5th ed.) handbook, PS99-2/2-1-2014, which matches the PDF page.
# Written from the handbook topics, never from memory of the real exam.
- id: crfsc-class-001
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "A handgun that is not prohibited belongs to which class?"
  options: ["Non-restricted", "Restricted", "Antique", "Unclassified"]
  answer: 1
  explanation: "Handguns that are not prohibited are restricted firearms."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: restricted firearms", page: "312"}
  law_checked_on: "2026-11-22"
  review: &reviewed {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: crfsc-class-002
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "A handgun is prohibited if its barrel is at or under what length?"
  options: ["76 mm", "105 mm", "150 mm", "470 mm"]
  answer: 1
  explanation: "Handguns with a barrel of 105 mm or less are prohibited firearms."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: prohibited firearms", page: "313"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-class-003
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "Handguns designed to fire which calibres are generally prohibited?"
  options: [".22 and .38", ".25 and .32", "9 mm and .40", ".357 and .44"]
  answer: 1
  explanation: "Handguns designed or adapted to discharge .25 or .32 calibre cartridges are prohibited, with a narrow exception for certain international sporting competition models."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: prohibited firearms", page: "313"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-class-004
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "A semi-automatic centre-fire rifle is restricted if its barrel is shorter than what length?"
  options: ["105 mm", "305 mm", "470 mm", "660 mm"]
  answer: 2
  explanation: "A semi-automatic centre-fire rifle or shotgun with a barrel shorter than 470 mm is a restricted firearm, unless it is prohibited."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: restricted firearms", page: "312"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-class-005
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "A rifle can still be fired when folded to an overall length of 600 mm. How is it classed?"
  options: ["Non-restricted", "Restricted", "Antique", "It depends only on the calibre"]
  answer: 1
  explanation: "A firearm that can be fired when reduced by folding or telescoping to an overall length under 660 mm is restricted."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: restricted firearms", page: "312"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-class-006
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "What is the general limit on cartridges a handgun magazine may hold?"
  options: ["5", "8", "10", "15"]
  answer: 2
  explanation: "Handgun magazines are generally limited to 10 cartridges. Magazines that hold more are prohibited devices unless permanently altered."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8. Semi-automatic actions: pistols", page: "282"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-class-007
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "What is the general magazine limit for a semi-automatic centre-fire rifle?"
  options: ["3 cartridges", "5 cartridges", "10 cartridges", "No limit"]
  answer: 1
  explanation: "Magazines for semi-automatic centre-fire rifles are generally limited to 5 cartridges."
  source: {handbook_edition: "2014 (5th ed.)", section: "Magazine-size limits", page: "124"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-storage-001
  course: crfsc
  topic: storage
  type: multiple-choice
  question: "Which option meets the storage rules for a restricted firearm kept in a home without a vault or safe?"
  options: ["Unloaded with a trigger lock, on a shelf", "Unloaded, in a locked container that is easy to carry, with no locking device on the firearm", "Unloaded, with a secure locking device, inside a securely locked container", "Loaded, in a locked room"]
  answer: 2
  explanation: "A restricted firearm must be unloaded, made inoperable with a secure locking device, and also locked in a container or room that is hard to break into. Ammunition must not be readily accessible unless locked up."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.3. Storage", page: "315"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-storage-002
  course: crfsc
  topic: storage
  type: true-false
  question: "A restricted firearm stored unloaded in a vault or safe built for firearms does not also need a trigger lock."
  options: ["True", "False"]
  answer: 0
  explanation: "The rules allow two options: a secure locking device plus a locked container or room, or storage in a vault, safe or room built or modified specifically to store restricted firearms securely."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.3. Storage", page: "315"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-storage-003
  course: crfsc
  topic: storage
  type: multiple-choice
  question: "Which best describes a secure locking device?"
  options: ["The firearm's own safety catch", "A device opened only by a key or combination that stops the firearm from being fired", "Any strap that holds the action closed", "A case with a zipper"]
  answer: 1
  explanation: "A secure locking device can only be released with an electronic, magnetic or mechanical key or a combination, and it prevents the firearm from being discharged while attached. Trigger locks and cable locks are examples."
  source: {handbook_edition: "2014 (5th ed.)", section: "Appendix C: Legal definitions", page: "332"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-display-001
  course: crfsc
  topic: display
  type: multiple-choice
  question: "A restricted firearm is displayed in a home. Besides being unloaded and fitted with a secure locking device, what else is required?"
  options: ["It must be kept in a glass case that visitors can see into but cannot open", "It must be securely attached to a structure that cannot easily be moved", "It must have its magazine inserted", "Nothing else"]
  answer: 1
  explanation: "A displayed restricted firearm must be unloaded, fitted with a secure locking device and securely attached to a non-portable structure so it cannot readily be removed. It must not be displayed with, or within easy reach of, ammunition for it."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.4. Display", page: "319"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-transport-001
  course: crfsc
  topic: transport
  type: multiple-choice
  question: "How must a restricted firearm be prepared for transport?"
  options: ["Unloaded, in any soft case", "Unloaded, with a secure locking device, in a locked opaque container that is hard to break into", "Loaded, in a locked container", "Unloaded, in a holster under a jacket"]
  answer: 1
  explanation: "A restricted firearm is transported unloaded, made inoperable with a secure locking device, and locked in an opaque container that cannot readily be broken open."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.5. Transportation", page: "321"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-transport-002
  course: crfsc
  topic: transport
  type: multiple-choice
  question: "What does ATT stand for?"
  options: ["Approved Target Training course", "Authorization to Transport", "Automatic Trigger Test", "Annual Transfer Tax"]
  answer: 1
  explanation: "An Authorization to Transport is what allows a licensed owner to move a restricted firearm between specified places, such as home and an approved range."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.5. Transportation", page: "321"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-transport-003
  course: crfsc
  topic: transport
  type: multiple-choice
  question: "You must leave a properly cased and locked restricted firearm in an unattended car that has a trunk. Where does it go?"
  options: ["On the back seat with the doors locked", "In the locked trunk", "Under the front seat", "In the glove box"]
  answer: 1
  explanation: "The locked container goes in the locked trunk or a similar lockable compartment. If the vehicle has none, the container must be out of sight inside the locked vehicle."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.5. Transportation", page: "321"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-transport-004
  course: crfsc
  topic: transport
  type: true-false
  question: "An Authorization to Transport allows you to carry a restricted firearm loaded while travelling to the range."
  options: ["True", "False"]
  answer: 1
  explanation: "An ATT only authorizes moving the firearm between places. The transport rules still apply: unloaded, secure locking device, locked opaque container."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.5. Transportation", page: "321"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-licence-001
  course: crfsc
  topic: licensing
  type: multiple-choice
  question: "Besides a licence with restricted privileges, what must a restricted firearm have?"
  options: ["A hunting tag", "A registration certificate", "A provincial inspection sticker", "Nothing else"]
  answer: 1
  explanation: "Every restricted firearm must be registered, and the owner must hold the registration certificate for it."
  source: {handbook_edition: "2014 (5th ed.)", section: "Appendix J: Transferring restricted firearms", page: "339"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-licence-002
  course: crfsc
  topic: licensing
  type: multiple-choice
  question: "Where may a restricted firearm generally be used for target shooting?"
  options: ["On any private land with permission", "At an approved shooting club or range", "On Crown land away from roads", "Anywhere a non-restricted firearm may be used"]
  answer: 1
  explanation: "Restricted firearms are generally limited to target practice or competition at an approved shooting club or range."
  source: {handbook_edition: "2014 (5th ed.)", section: "Module 17: overview", page: "315"}
  law_checked_on: "2026-11-22"
  review: *reviewed
- id: crfsc-actions-001
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "What must you do before each shot with a single-action revolver?"
  options: ["Pull the trigger twice", "Cock the hammer by hand", "Rotate the cylinder by hand", "Rack the slide"]
  answer: 1
  explanation: "On a single-action revolver the trigger only releases the hammer. The hammer must be cocked by hand before every shot."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7. Revolver actions", page: "265"}
  review: *reviewed
- id: crfsc-actions-002
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "What does pulling the trigger do on a double-action revolver?"
  options: ["Only releases a hammer that is already cocked", "Cocks the hammer and then releases it", "Opens the cylinder", "Ejects the fired case"]
  answer: 1
  explanation: "A double-action trigger pull both cocks and releases the hammer, and rotates the cylinder to the next chamber."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.3. Trigger functions", page: "257"}
  review: *reviewed
- id: crfsc-actions-003
  course: crfsc
  topic: actions
  type: true-false
  question: "Once the magazine is removed from a semi-automatic pistol, the pistol is unloaded."
  options: ["True", "False"]
  answer: 1
  explanation: "A cartridge can remain in the chamber after the magazine is out. The slide must be drawn back and the chamber checked."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8.1. Semi-automatic unloading procedure", page: "278"}
  review: *reviewed
- id: crfsc-prove-001
  course: crfsc
  topic: prove
  type: multiple-choice
  question: "When unloading a semi-automatic pistol, why is the magazine removed before the slide is pulled back?"
  options: ["To make the slide lighter", "Because cycling the slide with a loaded magazine in place feeds another cartridge into the chamber", "To protect the magazine spring", "It makes no difference which is done first"]
  answer: 1
  explanation: "With a loaded magazine still in the pistol, working the slide ejects one cartridge and chambers the next. Magazine out first, then open the action."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8.1. Semi-automatic unloading procedure", page: "278"}
  review: *reviewed
- id: crfsc-prove-002
  course: crfsc
  topic: prove
  type: multiple-choice
  question: "On a revolver, what does verifying the feeding path mean?"
  options: ["Checking the magazine well", "Checking every chamber in the cylinder", "Checking the hammer spur", "Checking the ejector rod is straight and clean"]
  answer: 1
  explanation: "A revolver's cylinder holds the cartridges, so each chamber in the cylinder must be checked to be empty."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7.3. Revolver: double-action swing-out cylinder unloading", page: "271"}
  review: *reviewed
- id: crfsc-prove-003
  course: crfsc
  topic: prove
  type: multiple-choice
  question: "What is the last step of PROVE on a handgun?"
  options: ["Engage the safety", "Examine the bore for obstructions", "Reinsert the empty magazine and close it", "Close the action"]
  answer: 1
  explanation: "E is Examine the bore. The barrel must be clear before the firearm is considered safe."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: PROVE It Safe", page: "219"}
  review: *reviewed
- id: crfsc-handling-001
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "Why does a handgun need extra attention to muzzle direction?"
  options: ["Handguns are louder", "The short barrel means a small wrist movement swings the muzzle across a wide area", "Handguns have no safeties", "Handgun bullets travel farther than rifle bullets"]
  answer: 1
  explanation: "Because the barrel is short, turning your wrist or body slightly can point a handgun at someone. Muzzle control takes constant attention."
  source: {handbook_edition: "2014 (5th ed.)", section: "Safe handling of restricted firearms", page: TBD}
  # Retired 2026-11-22: the handbook does not give the reasoning this question tests. Replaced by crfsc-handling-004.
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: retired}
- id: crfsc-handling-002
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "Where should your trigger finger rest while you handle a handgun without intending to fire?"
  options: ["On the trigger, lightly", "Inside the trigger guard, but resting in front of the trigger", "Straight along the frame, outside the trigger guard", "On the hammer"]
  answer: 2
  explanation: "Keep the finger off the trigger and out of the trigger guard, resting along the frame where others can see it."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "218"}
  review: *reviewed
- id: crfsc-handling-003
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "In what condition should a semi-automatic pistol be handed to another person?"
  options: ["Magazine in, slide forward, safety on", "Proven safe, magazine removed, slide locked open", "Hammer cocked and safety on, so they can see it is ready", "In its holster"]
  answer: 1
  explanation: "PROVE it safe and pass it with the magazine out and the action locked open, muzzle in a safe direction. The receiver proves it safe as well."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "218"}
  review: *reviewed
- id: crfsc-ammo-001
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "How do you confirm which ammunition a handgun is made to fire?"
  options: ["By the size of the magazine", "By the data stamp on the barrel or slide, matched to the cartridge head stamp", "By asking the previous owner", "Any cartridge that chambers is correct"]
  answer: 1
  explanation: "Match the cartridge head stamp to the firearm's data stamp. Several handgun cartridges look alike but are not interchangeable."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3. Cartridges", page: "238"}
  review: *reviewed
- id: crfsc-misfire-001
  course: crfsc
  topic: misfires
  type: multiple-choice
  question: "At the range your pistol clicks but does not fire. What do you do?"
  options: ["Turn to ask the person beside you for help", "Keep it pointed downrange and wait 60 seconds before opening the action", "Immediately rack the slide", "Holster it and step back"]
  answer: 1
  explanation: "It may be a hang fire. Keep the muzzle pointed downrange, wait 60 seconds, then unload following safe procedure."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.6. Hazards", page: "250"}
  review: *reviewed
- id: crfsc-range-001
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "Your handgun jams on the firing line and you cannot clear it. What is the correct response?"
  options: ["Carry it back to the range officer", "Keep the muzzle pointed downrange, finger off the trigger, and get help from the range officer or another qualified person", "Turn around and point it at the ground behind the firing line while you work on it", "Force the action open to clear it yourself"]
  answer: 1
  explanation: "The muzzle must always point downrange, and a firearm jammed with a cartridge in the chamber can be hazardous. Leave it on the firing line and get help from a qualified person rather than forcing the action or turning with it."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.9. Firearm malfunctions; 16.5. Safety procedures at the range", page: "283, 299"}
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: crfsc-range-002
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "Someone calls \"cease fire\" at the range. What do you do?"
  options: ["Finish your magazine, then stop", "Stop shooting immediately and wait for instructions", "Stop only if it was the range officer who called it, not another shooter", "Holster your loaded handgun"]
  answer: 1
  explanation: "Anyone may call a cease fire and everyone obeys at once: stop shooting, keep the muzzle downrange, and follow the range officer's instructions."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5. Safety procedures at the range", page: "300"}
  review: *reviewed

- id: crfsc-handling-004
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "Under the Vital Four ACTS, what does controlling the muzzle direction involve?"
  options: ["Identifying the safest available direction and keeping the muzzle pointed there", "Pointing the muzzle at the person you are handing the firearm to, so they can see it", "Keeping the safety on, so the muzzle direction no longer matters", "Pointing the muzzle at yourself, where you can watch it"]
  answer: 0
  explanation: "Control the muzzle direction at all times: identify the safest available direction and keep the firearm pointed that way. The muzzle should never point towards yourself or anyone else."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: The Vital Four ACTS of Firearm Safety", page: "218"}
  review: {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}

# Batch 2, drafted from the 2014 handbook and reviewed by the instructor on 2026-11-22.
- id: crfsc-actions-004
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "How does a revolver hold its cartridges?"
  options: ["One in each chamber of a rotating cylinder", "In a detachable magazine in the grip", "In a tube under the barrel", "In a single chamber loaded by hand for each shot"]
  answer: 0
  explanation: "A revolver has several chambers in a rotating cylinder, each holding one cartridge. Cylinders may be non-swing, swing-out or top break."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.1. Common types of handgun actions", page: "256"}
  review: &reviewed2 {reviewed_by: Milan, reviewed_on: "2026-11-22", status: reviewed}
- id: crfsc-safeties-001
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "What does a decocking lever do on a double-action semi-automatic handgun?"
  options: ["Releases the magazine", "Safely lowers the hammer", "Locks the slide open", "Lightens the trigger pull"]
  answer: 1
  explanation: "Pressing the decocking lever safely lowers the hammer, so you do not have to lower it by hand. On some handguns it also engages the safety."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "259"}
  review: *reviewed2
- id: crfsc-safeties-002
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "What does a magazine disconnect safety do?"
  options: ["Prevents the handgun from firing when the magazine is removed", "Ejects the magazine when the handgun is empty", "Stops the magazine from being removed while the safety catch is on", "Counts the cartridges left in the magazine"]
  answer: 0
  explanation: "A magazine disconnect safety prevents the firearm from being discharged when the magazine is removed. Like any safety, it can fail."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "260"}
  review: *reviewed2
- id: crfsc-safeties-003
  course: crfsc
  topic: safeties
  type: true-false
  question: "If a handgun has a half-cock position, that position is always a safety."
  options: ["True", "False"]
  answer: 1
  explanation: "The presence of a half cock does not guarantee it is a safety. Some firearms do not use it as one. Consult the owner's manual."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "260"}
  review: *reviewed2
- id: crfsc-safeties-004
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "On a revolver, what does a hammer block or transfer bar do?"
  options: ["Keeps the firing pin from reaching the primer unless the trigger is held all the way back", "Locks the cylinder so it cannot be opened", "Stops the hammer from being cocked by hand", "Holds the cartridges in the cylinder"]
  answer: 0
  explanation: "On many older revolvers the firing pin can rest on a cartridge's primer, so a blow to the hammer can fire it. A hammer block or transfer bar prevents this unless the trigger is held fully to the rear."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "260"}
  review: *reviewed2
- id: crfsc-muzzle-001
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "In a black powder revolver, why is grease placed in front of each projectile?"
  options: ["To increase the speed of the ball", "To prevent chain-firing", "To make the cylinder easier to turn", "So the revolver never needs cleaning"]
  answer: 1
  explanation: "Grease in front of each projectile helps stop the flash from one shot igniting the charges in the other chambers, which is called chain-firing."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.2.3. DOs and DON'Ts of muzzleloading", page: "232"}
  review: *reviewed2
- id: crfsc-muzzle-002
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "How should you put the powder charge into a muzzleloader?"
  options: ["Pour it straight from the powder horn or flask into the muzzle until it looks right", "Measure it with a volumetric measure, then pour it into the muzzle", "Judge the amount by eye", "Use smokeless powder for a cleaner shot"]
  answer: 1
  explanation: "Always use a volumetric measure to pour powder into the muzzle, never the powder horn or flask, and follow the manufacturer's maximum charge."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.2.3. DOs and DON'Ts of muzzleloading", page: "232"}
  review: *reviewed2
- id: crfsc-shooting-001
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "With open sights, what is sight alignment?"
  options: ["Lining up the rear and front sights with the target", "Adjusting the sights at a gunsmith", "Closing one eye", "Moving the target closer"]
  answer: 0
  explanation: "Sight alignment is physically lining up the rear and front sights with the target. Aiming them at a target creates the sight picture."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.1. Sight alignment/Sight picture", page: "297"}
  review: *reviewed2
- id: crfsc-shooting-002
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "When in your breathing cycle should you release the shot?"
  options: ["While holding a full breath", "While breathing in", "In the natural pause at the bottom of an exhale", "Right after a deep breath in, while the lungs are still full"]
  answer: 2
  explanation: "Holding your breath is not natural. Release the shot in the natural pause at the bottom of each exhale."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.2. Breathing as it relates to shot release", page: "297"}
  review: *reviewed2
- id: crfsc-shooting-003
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How should you operate the trigger for an accurate shot?"
  options: ["Pull it quickly once the sights cross the target", "Squeeze it slowly and steadily", "Jerk it to beat the recoil", "Press it halfway, then snap it"]
  answer: 1
  explanation: "With the sights aligned on the target, squeeze the trigger slowly and steadily. Anything other than a smooth squeeze moves the firearm and sends the shot off target."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.3. Trigger control", page: "298"}
  review: *reviewed2
- id: crfsc-shooting-004
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "What is follow-through?"
  options: ["Walking to the target to check where your shot landed once the line is safe", "Keeping your sight picture and shooting position after the shot", "Reloading immediately after firing", "Cleaning the barrel after each string"]
  answer: 1
  explanation: "Follow-through means maintaining your sight picture and position after discharging the firearm. Without it, the shot is more likely to go off target."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.4. Follow-through", page: "298"}
  review: *reviewed2
- id: crfsc-range-003
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "When is a firearm under your direct control?"
  options: ["When it is registered to you", "When it is within your eyesight and/or arm's reach", "When it is anywhere on the same range as you, even out of sight", "When it is locked in your car"]
  answer: 1
  explanation: "Direct control means the firearm is within eyesight and/or arm's reach of the shooter. A firearm that leaves your direct control must be proven safe again."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5. Safety procedures at the range", page: "301"}
  review: *reviewed2
- id: crfsc-range-004
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "A guest without a firearms licence wants to try shooting at the range. What does the handbook recommend?"
  options: ["They may not shoot at all", "They must be under direct and immediate supervision while shooting", "They may shoot alone once they have watched licensed shooters for a while first", "They may shoot only rimfire firearms"]
  answer: 1
  explanation: "Minors and guests without a valid firearms licence should be under direct and immediate supervision while shooting. Check the range's own rules too."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5. Safety procedures at the range", page: "301"}
  review: *reviewed2
- id: crfsc-class-008
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "Which of these is a reason for which individuals may generally possess restricted firearms?"
  options: ["Target practice or competition", "Hunting big game", "Protecting their home", "Carrying for personal protection"]
  answer: 0
  explanation: "In general, restricted firearms may be possessed for a lawful profession or occupation, for target practice or competition, or as part of a gun collection."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: restricted firearms", page: "312"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-class-009
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "Which of these is a prohibited firearm?"
  options: ["An automatic firearm", "A single-shot shotgun", "A lever-action rifle", "A bolt-action rifle with a 24-inch barrel"]
  answer: 0
  explanation: "Automatic firearms are prohibited. Ordinary single-shot, lever-action and bolt-action long guns of normal length are non-restricted."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.1. Classes of firearms: prohibited firearms", page: "313"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-class-010
  course: crfsc
  topic: classification
  type: multiple-choice
  question: "Which of these is a prohibited device?"
  options: ["A telescopic sight", "A device designed to muffle or stop the sound of a firearm", "A trigger lock", "A bipod"]
  answer: 1
  explanation: "Silencers, meaning devices designed to muffle or stop the sound of a firearm, are prohibited devices. So are handgun barrels of 105 mm or less and magazines prescribed as prohibited."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.2.1. Prohibited devices", page: "314"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-storage-004
  course: crfsc
  topic: storage
  type: multiple-choice
  question: "Where may a restricted firearm be stored?"
  options: ["At any address where you stay overnight", "Only at the address on its registration", "At a friend's home if they hold a licence", "In your vehicle, if it is locked"]
  answer: 1
  explanation: "A restricted firearm may only be stored at the address shown on its registration."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.3. Storage", page: "316"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-display-002
  course: crfsc
  topic: display
  type: multiple-choice
  question: "You display a restricted firearm at a gun show, away from its registered address. Which set of conditions is required?"
  options: ["Loaded, as long as you stand beside it", "Unloaded and lying loose on the table", "Unloaded, with a secure locking device, and fastened by a chain or metal cable so it cannot easily be removed", "Only inside a closed case, never on display"]
  answer: 2
  explanation: "Away from its usual address, a displayed restricted firearm must be unloaded, have a secure locking device, be securely attached by a chain, metal cable or similar device, and not be within easy access to its ammunition. It may be removed to let someone handle it under your direct supervision."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.4. Display", page: "319"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-transport-005
  course: crfsc
  topic: transport
  type: true-false
  question: "Removing the firing pin from a restricted handgun makes it legally disabled for transport."
  options: ["True", "False"]
  answer: 1
  explanation: "Removing the firing pin or any other component does not make a restricted or prohibited handgun legally disabled for transport. The transport rules still apply."
  source: {handbook_edition: "2014 (5th ed.)", section: "17.5. Transportation", page: "321"}
  law_checked_on: "2026-11-22"
  review: *reviewed2
- id: crfsc-resp-001
  course: crfsc
  topic: responsibilities
  type: multiple-choice
  question: "You lose your firearms licence. What must you do?"
  options: ["Nothing until it is time to renew", "Report the loss with reasonable dispatch to a peace officer, firearms officer or Chief Firearms Officer", "Tell your shooting club only", "Wait six months in case it turns up"]
  answer: 1
  explanation: "Losing a firearm, licence, registration certificate or authorization, or having one stolen, must be reported with reasonable dispatch to a peace officer, firearms officer or Chief Firearms Officer. Failing to do so is an offence."
  source: {handbook_edition: "2014 (5th ed.)", section: "Appendix F: Reporting lost or stolen firearms, licences, etc.", page: "335"}
  law_sensitive: true
  law_checked_on: "2026-11-22"
  review: *reviewed2

# Batch 3 (drafted 2026-11-22 from the 2014 handbook; approved by Milan Vrekic 2026-11-22)
- id: crfsc-muzzle-101
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Which grade of black powder is used only to prime flintlock pans?"
  options: ["FFFg or Fg", "FFg", "Fg", "FFFFg"]
  answer: 3
  explanation: "FFFFg has the finest granules and is used only in flintlock priming pans. Never use it as a powder charge."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.1.1. Black powder", page: "224"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-102
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "How does the size of black powder granules affect pressure?"
  options: ["Granule size makes no difference", "Coarser granules create more pressure", "Finer granules create more pressure", "Finer granules create less pressure"]
  answer: 2
  explanation: "The finer the granules, the more pressure they create when fired. That is why FFFFg is only ever used for priming."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.1.1. Black powder", page: "224"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-103
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Your old black powder has caked together and grown white crystals. What should you do?"
  options: ["Dry it out in a warm oven", "Break up the lumps and use it", "Soak it in water right away", "Mix it with fresh powder before use"]
  answer: 2
  explanation: "Caked powder with white crystals has become very unstable and should be soaked in water immediately."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.1.1. Black powder", page: "224"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-104
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Why not reload a black-powder firearm the moment you have fired it?"
  options: ["The percussion cap needs a full minute to reset after each shot", "Glowing embers in the bore could set off the new powder", "The barrel must cool or the ball won't seat", "Fresh powder sticks to a warm bore and won't fire"]
  answer: 1
  explanation: "Glowing embers may remain in the bore after firing. Reloading straight away could create an explosion hazard."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.1.1. Black powder", page: "225"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-105
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Why put grease in front of each projectile in a black-powder revolver?"
  options: ["To prevent chain-firing", "To slow the ball for better accuracy", "To keep the caps from falling off", "To make the cylinder turn more easily"]
  answer: 0
  explanation: "Grease in front of each projectile in a black-powder revolver helps prevent chain-firing, where one discharge sets off the other chambers."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.2.3. DOs and DON'Ts of muzzleloading", page: "232"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-106
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "What is a sabot, in muzzleloading?"
  options: ["A cone-shaped bullet with a hollow base", "A plastic carrier that encases a projectile", "A small charge of fine priming powder for the pan", "A round ball loaded with a greased patch"]
  answer: 1
  explanation: "A sabot is a plastic or synthetic carrier that encases a projectile. Other projectiles are round balls with patches, conical Minié balls and shot."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.1.2. Black powder projectiles", page: "225"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-handling-101
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "When you close the action to chamber a cartridge in a handgun, how should you hold it?"
  options: ["Pointed at the ground just in front of your feet", "Close to your chest, where it is easier to control", "Tilted up toward the ceiling of the range", "Pointed downrange, arm out, wrist and elbow locked"]
  answer: 3
  explanation: "To close the action: point downrange, extend the arm, lock the wrist and elbow, and close the action. Leave any safety on until ready to fire."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.6.3. Loading procedure", page: "264"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-actions-101
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "On a single-action revolver, what must you do for each shot?"
  options: ["Pull the trigger, which cocks and releases", "Press the cylinder release between shots", "Open the loading gate and turn the cylinder", "Cock the hammer by hand to full cock"]
  answer: 3
  explanation: "With a single-action revolver the hammer must be placed in full cock by hand for each shot. Pulling the trigger does one thing: it releases the hammer."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7.0. Operating repeating firearms: revolver actions", page: "265"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-actions-102
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "How are cartridges loaded and unloaded in most single-action revolvers?"
  options: ["By breaking the frame open at a hinge", "By removing a magazine from the grip", "One at a time through a loading port", "By swinging the cylinder out to the side"]
  answer: 2
  explanation: "Most single-action revolvers have cylinders that do not swing out. Cartridges go in and come out one at a time through a loading port, usually on the right side."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7.0. Operating repeating firearms: revolver actions", page: "265"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-prove-101
  course: crfsc
  topic: prove
  type: multiple-choice
  question: "While unloading a single-action revolver, what should you do with cartridges you push out?"
  options: ["Let them fall on the bench and leave them till you finish", "Catch each one and put it back in its box", "Reload them right away to check every chamber turns freely", "Put them in your pocket as they come out"]
  answer: 0
  explanation: "Let any cartridge or casing fall on the bench or range floor and leave it there until you have completed all the unloading steps."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7.1. Revolver: single-action unloading procedure", page: "267"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-actions-103
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "In a double-action-only semi-automatic pistol, what does the hammer do after each shot?"
  options: ["Locks back until the slide is released", "Drops to half cock automatically", "Returns to the forward position", "Stays cocked for a lighter next pull"]
  answer: 2
  explanation: "In double-action-only pistols the hammer returns forward after each shot. In single-action and double-action pistols it stays cocked."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8. Semi-automatic actions: pistols", page: "275"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-handling-102
  course: crfsc
  topic: handling
  type: multiple-choice
  question: "You are about to charge a pistol magazine. How should the pistol be?"
  options: ["Held in your hand, slide forward, finger off", "Set down, muzzle safe, action open", "Holstered, with the safety on", "Pointed downrange, slide closed"]
  answer: 1
  explanation: "Put the firearm down with the muzzle pointed in a safe direction and the action open, then charge the magazine by inserting cartridges."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8.2. Semi-automatic: loading procedure", page: "281"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-101
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "On the firing range, which type of hearing protection should you always wear?"
  options: ["Cotton in your ears", "Headphone-type protectors", "None needed for small calibres", "Foam earplugs alone"]
  answer: 1
  explanation: "On the range, always wear headphone-type protectors. For maximum protection, wear earplugs under them as well."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.1.2. Hearing protection", page: "286"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-102
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "You trip while holding a handgun at the range. What should you do first?"
  options: ["Engage the safety", "Drop the handgun", "Control the muzzle", "Catch yourself with both hands"]
  answer: 2
  explanation: "Your first action in a fall is to control the muzzle. The damage from a fall is probably less than the damage from an unintentional discharge."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.1.3. Slips and falls", page: "287"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-shooting-101
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "With a two-handed grip on a semi-automatic pistol, why keep your thumbs off the back of the slide?"
  options: ["It makes the trigger pull much heavier", "It can push the magazine release by mistake", "The recoiling slide can injure your hand", "Thumbs there block the rear sight picture"]
  answer: 2
  explanation: "With an incorrect grip, the weak-hand thumb can sit behind the slide, and the recoiling slide can injure it. Keep both thumbs on the weak-hand side, clear of the slide."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.3.1. The two-handed grip", page: "288"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-shooting-102
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How firmly should you grip a handgun?"
  options: ["Loosely, so it can move in recoil", "About as firmly as a carpenter's hammer", "As tightly as you possibly can", "With fingertips only, for a light touch"]
  answer: 1
  explanation: "Grip the handgun with about the same pressure you would use to hold a carpenter's hammer."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.3.1. The two-handed grip", page: "288"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-shooting-103
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "In the two-handed stance, how should you stand?"
  options: ["Leaning back with your knees locked", "Square to the target, feet shoulder width apart", "Turned 45 degrees away, with all your weight forward", "Side-on to the target, feet together"]
  answer: 1
  explanation: "Face the target squarely, feet about shoulder width apart, weight even, knees straight but not locked, arms out with elbows locked."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.3.2. The two-handed stance", page: "289"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-shooting-104
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "Why aim a handgun with both eyes open when you can?"
  options: ["It stops your master eye from taking over the sight picture", "It reduces the felt recoil of each shot", "It makes the front sight look sharper", "You see more of the area around the target"]
  answer: 3
  explanation: "Always try to aim with both eyes open, as this gives a better view of the area surrounding the target."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.4. Aiming handguns", page: "292"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-shooting-105
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "How should you bring a handgun with a red dot or scope onto the target?"
  options: ["Close both eyes briefly, then open them on the sight", "Look away, then find the target through the sight", "Look through the sight first, then sweep around until you find the target", "Watch the target and raise the gun until the sight comes up"]
  answer: 3
  explanation: "Don't look away and then search through the sight. Keep watching the target and raise the handgun into the two-handed stance until the sight comes up between your eye and the target."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.4. Aiming handguns", page: "292"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-103
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "On the range, when must a firearm's action be open?"
  options: ["Only when walking to and from the line", "Only while the range is not active, between relays", "Only during a cease-fire", "At all times except when actually shooting"]
  answer: 3
  explanation: "Range safety rules normally require the action of any firearm to be open at all times except when actually shooting."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5.2. Range safety rules", page: "299"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-104
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "When may you load your handgun on the range?"
  options: ["When the Range Officer gives the command to load", "As soon as you reach your firing point", "Once your target is set up and you are ready to begin", "When the shooter beside you starts firing"]
  answer: 0
  explanation: "No firearm is loaded until the Range Officer gives the command to load. Commands of the Range Officer must be followed at all times."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5.2. Range safety rules", page: "299"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-105
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "Which of these is an unacceptable target on the range?"
  options: ["A target approved by the Range Officer", "A concrete walkway or target holder frame", "A paper target directly in front of you", "Your own target, once the range is active"]
  answer: 1
  explanation: "Unacceptable targets include anything that can cause ricochets, such as target holder frames or concrete walkways, and anything that may damage the range."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.6.2. Unacceptable targets", page: "303"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-106
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "Where should someone firing a semi-automatic set up on the line?"
  options: ["Upwind of everyone, whatever the casings", "Where ejected casings won't disturb others", "Right beside the newest shooter, so you can help them", "At the very centre of the firing line"]
  answer: 1
  explanation: "Those firing semi-automatic firearms should take a firing point where other people will not be disturbed by ejected casings."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.5.3. Range courtesy", page: "302"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-care-101
  course: crfsc
  topic: care
  type: multiple-choice
  question: "When cleaning a revolver, what should you do with the cylinder?"
  options: ["Oil it heavily before brushing", "Support it, to avoid damaging it", "Leave it closed and clean from the muzzle", "Spin it fast to clear residue"]
  answer: 1
  explanation: "When cleaning a revolver, always support the cylinder to avoid potential damage, and clean from the breech toward the muzzle."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.8.2. General cleaning procedures", page: "306"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-care-102
  course: crfsc
  topic: care
  type: multiple-choice
  question: "Your handgun was cleaned and oiled for storage. What should you do before firing it again?"
  options: ["Run a dry patch through the bore and chambers", "Add a little more oil to the bore for a smoother first shot", "Fire one round to burn the oil out", "Nothing; light oil does no harm when fired"]
  answer: 0
  explanation: "Before the next firing, run a dry patch through the bore and chambers to remove any oil. Oil or dirt in the barrel can raise pressure enough to burst it."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.8.2. General cleaning procedures", page: "306"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-care-103
  course: crfsc
  topic: care
  type: multiple-choice
  question: "After cleaning a firearm for storage, why avoid touching the metal parts?"
  options: ["Skin oil makes the finish slippery", "Acids in sweat can cause rust", "Fingerprints show up on inspection", "Warm hands make the metal expand"]
  answer: 1
  explanation: "After cleaning for storage, avoid skin contact with metal parts. Acids in perspiration can cause rust."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.8.2. General cleaning procedures", page: "307"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-care-104
  course: crfsc
  topic: care
  type: multiple-choice
  question: "Which of these does the handbook say never to do while cleaning a firearm?"
  options: ["Clean it with a bore brush", "Clean it with the bolt or slide removed", "Clean it from the breech end", "Clean it while watching television"]
  answer: 3
  explanation: "Always give cleaning your full attention. Never clean a firearm while doing something else, like watching television, and make sure no ammunition is nearby."
  source: {handbook_edition: "2014 (5th ed.)", section: "16.8.1. Cleaning materials", page: "306"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-resp-101
  course: crfsc
  topic: responsibilities
  type: multiple-choice
  question: "Can you hunt with a restricted firearm in Canada?"
  options: ["Yes, during the regular big-game season", "Yes, but only for small game and birds", "Yes, if you also hold a hunting licence", "No, the handbook says it is forbidden"]
  answer: 3
  explanation: "The handbook states that it is forbidden to hunt with a restricted firearm in Canada, and that hunting with a handgun is not permitted."
  source: {handbook_edition: "2014 (5th ed.)", section: "Introduction: Legal responsibilities", page: "220"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-range-107
  course: crfsc
  topic: range-and-field
  type: multiple-choice
  question: "Before firing at any target on the range, which of these should you ask yourself?"
  options: ["Is my target the biggest one?", "Can I hit it from the hip?", "Has the shooter beside me fired?", "Is the range active?"]
  answer: 3
  explanation: "Verify every target: Is the range active? Am I sure I am shooting at my target? Are the targets approved by the Range Safety Officer?"
  source: {handbook_edition: "2014 (5th ed.)", section: "16.6.1. Acceptable targets", page: "303"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}
- id: crfsc-muzzle-107
  course: crfsc
  topic: muzzleloaders
  type: multiple-choice
  question: "Before loading one chamber of a muzzleloading revolver, what must you do?"
  options: ["Fire a cap on every chamber first", "Remove the caps from the other chambers' nipples", "Fill every chamber with powder at once, then add the balls", "Cock the hammer to full cock"]
  answer: 1
  explanation: "Don't load one chamber of a muzzleloading revolver unless the percussion caps on the nipples of the other chambers have been removed."
  source: {handbook_edition: "2014 (5th ed.)", section: "12.2.3. DOs and DON'Ts of muzzleloading", page: "233"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-22, status: reviewed}

# Batch 4, drafted 2026-11-24 from the 2014 handbook; approved by Milan Vrekic 2026-11-24.
- id: crfsc-ammo-101
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "Can .38 S&W, .38 Special and .38 Super Auto cartridges be used in place of one another?"
  options: ["Yes, they are all .38 calibre, so any of them will chamber and fire safely", "Yes, in any revolver", "No: cartridges with different names are not interchangeable", "Only the two shorter ones"]
  answer: 2
  explanation: "Cartridges with different names are not interchangeable, even when the calibre number is the same. Use only the cartridge named on the handgun's data stamp."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3.2. Cartridge names", page: "242"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-ammo-102
  course: crfsc
  topic: ammunition
  type: true-false
  question: "A .22 Magnum cartridge can be used in a handgun made for .22 Long Rifle cartridges."
  options: ["True", "False"]
  answer: 1
  explanation: "False. The .22 Magnum is not interchangeable with the other .22 rim-fire cartridges."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3.1. Types of cartridges", page: "240"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-ammo-103
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "Someone offers you a box of reloaded cartridges. What does the handbook advise?"
  options: ["Use them only for practice", "Do not accept or use them unless you know they were reloaded correctly", "Use them only in a revolver", "Fire one from each box to test the batch before you use the rest"]
  answer: 1
  explanation: "Do not accept or use reloaded cartridges unless you know they were made and reloaded correctly."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3. Cartridges", page: "238"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-ammo-104
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "Which list names the four components of a handgun cartridge?"
  options: ["Bullet, powder charge, case and primer", "Bullet, wad, case and primer", "Slug, powder charge, rim and cap", "Bullet, powder charge, case and magazine"]
  answer: 0
  explanation: "A handgun cartridge has four components: the bullet, the powder charge, the case and the primer."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3.3. Cartridge components and materials", page: "245"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-ammo-105
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "According to the handbook, how far can a handgun fire a bullet?"
  options: ["About 100 metres", "About 500 metres", "About one kilometre", "More than two kilometres"]
  answer: 3
  explanation: "Handguns can shoot a bullet more than two kilometres. Know the dangerous range of your ammunition and what lies beyond your target."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.4. Ballistics", page: "248"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-ammo-106
  course: crfsc
  topic: ammunition
  type: multiple-choice
  question: "Why should you avoid dry firing a rim-fire handgun?"
  options: ["It can damage the firearm", "It wears out the sights", "It loosens the grips", "It is against range rules everywhere"]
  answer: 0
  explanation: "Dry firing a rim-fire firearm can damage it."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.3.1. Types of cartridges", page: "240"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-misfire-101
  course: crfsc
  topic: misfires
  type: multiple-choice
  question: "A cartridge misfired, and after waiting you have unloaded it safely. What do you do with it?"
  options: ["Load it again as the last round in the magazine", "Keep it for practice", "Dispose of it properly and do not reuse it", "Tap the primer to check it"]
  answer: 2
  explanation: "Misfired cartridges should not be reused. Dispose of them properly."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.6. Hazards", page: "250"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-misfire-102
  course: crfsc
  topic: misfires
  type: multiple-choice
  question: "A shot makes only a faint pop with almost no recoil. What is the danger?"
  options: ["The magazine has jammed and will not feed", "The sights have moved", "The slide has cracked", "A bullet may be lodged in the barrel"]
  answer: 3
  explanation: "A primer pop (squib load) happens when the cartridge has no powder or the powder is no longer effective. It may have enough force to push the bullet out of the case, but the bullet may lodge in the barrel. If another round is fired, the barrel may rupture."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.6. Hazards", page: "250"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-storage-101
  course: crfsc
  topic: storage
  type: multiple-choice
  question: "Where may ammunition be kept in relation to a stored restricted firearm?"
  options: ["Anywhere, if the firearm has a trigger lock", "Not within easy access of it, unless the ammunition is in a securely locked container", "In the magazine, if the magazine is out of the firearm and kept in the same unlocked drawer", "Beside it, if both are out of sight"]
  answer: 1
  explanation: "Ammunition for a restricted firearm must not be within easy access of the firearm unless it is in a securely locked container or receptacle, or in a vault, safe or room built for restricted firearms."
  source: {handbook_edition: "2014 (5th ed.)", section: "13.8. Ammunition precautions and legislation", page: "251"}
  law_checked_on: "2026-11-24"
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-actions-104
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "What are the two basic types of handgun action?"
  options: ["Bolt and lever", "Pump and hinge", "Revolver and semi-automatic", "Single shot and fully automatic"]
  answer: 2
  explanation: "Handguns are generally classified by their type of action. The two basic types are the revolving action and the semi-automatic action."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.1. Common types of handgun actions", page: "256"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-actions-105
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "Which list gives the three trigger functions found on handguns?"
  options: ["Single action, double action and double action only", "Light, medium and heavy", "Safe, half cock and full cock", "Semi-automatic fire, burst fire and fully automatic fire, chosen with a selector"]
  answer: 0
  explanation: "There are three primary trigger functions: single action, double action and double action only."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.3. Trigger functions", page: "257"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-safeties-101
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "A cease-fire is called while your single-action revolver is at full cock. What controls the hammer as you lower it?"
  options: ["The safety catch", "The slide", "Your weak-hand thumb, placed fully on the hammer", "The mainspring alone, once the safety catch is on"]
  answer: 2
  explanation: "Keep a solid grip with the strong hand and place the weak-hand thumb fully on the hammer. Pull the trigger and begin to lower the hammer slowly, releasing the trigger once the hammer is disengaged."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "260"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-safeties-102
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "Besides its safeties, what does a double-action handgun rely on to help prevent unintentional firing?"
  options: ["A lighter trigger", "A heavy double-action trigger pull", "A shorter barrel", "A magazine that locks the slide when empty"]
  answer: 1
  explanation: "Double-action handguns also rely on a heavy double-action trigger pull as a further safety barrier to unintentional firing."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "260"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-safeties-103
  course: crfsc
  topic: safeties
  type: multiple-choice
  question: "Why do handguns with an internal hammer or striker need extra care?"
  options: ["They cannot be unloaded", "They have no safeties", "They fire as soon as the slide closes", "You cannot see whether they are cocked"]
  answer: 3
  explanation: "All the safety procedures for exposed hammers apply, but because the hammer is not visible it is difficult to see whether it is cocked. Great care should be taken."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.4.2. Built-in safeties", page: "261"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-actions-106
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "After operating the cylinder release on a swing-out revolver, how do you remove the cartridges?"
  options: ["Tip the muzzle slightly up and work the ejector rod", "Shake the revolver over the bench", "Pull the trigger to turn the cylinder and drop them one at a time", "Pick each one out with a tool"]
  answer: 0
  explanation: "Operate the cylinder release and swing the cylinder out. Tip the muzzle slightly upward in a safe direction and operate the ejector rod so the cartridges or casings fall out. Remove by hand any that do not."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.7.3. Revolver: double-action swing-out cylinder and break open, unloading procedure", page: "271"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-actions-107
  course: crfsc
  topic: actions
  type: multiple-choice
  question: "A charged magazine is seated in a semi-automatic pistol. What chambers the first cartridge?"
  options: ["Pressing the magazine release while holding the trigger", "Pulling the trigger", "Applying the safety", "Pulling the slide fully to the rear and releasing it"]
  answer: 3
  explanation: "Pull the slide quickly and completely to the rear and let it go. The recoil spring pushes the slide forward, chambering a cartridge."
  source: {handbook_edition: "2014 (5th ed.)", section: "14.8.2. Semi-automatic: loading procedure", page: "282"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
