  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-shooting-107
  course: crfsc
  topic: shooting-technique
  type: multiple-choice
  question: "Which sights do not need the sight alignment that open sights need?"
  options: ["Fixed iron sights", "Adjustable target sights", "Scopes and electronic sights", "Any sights fitted to a revolver"]
