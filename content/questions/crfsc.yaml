- id: crfsc-transport-101
  course: crfsc
  topic: transport
  type: multiple-choice
  question: "Does a heavy-duty soft case, such as a nylon one, meet the container requirement for transporting a restricted firearm?"
  options: ["No, only a hard case does", "Yes, as long as it can be locked securely", "Yes, even if it cannot be locked, provided it is zipped", "Only for trips under an hour"]
  answer: 1
  explanation: "A restricted firearm must travel in a locked, opaque container that cannot easily be broken open. A heavy-duty soft case qualifies if it can be locked securely."
