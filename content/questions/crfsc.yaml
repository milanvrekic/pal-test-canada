- id: crfsc-resp-001
  course: crfsc
  topic: responsibilities
  type: multiple-choice
  question: "You lose your firearms licence. What must you do?"
  options: ["Nothing until it is time to renew", "Report the loss with reasonable dispatch to a peace officer, firearms officer or Chief Firearms Officer", "Tell your shooting club only", "Wait six months in case it turns up"]
  answer: 1
  explanation: "Losing a firearm, licence, registration certificate or authorization, or having one stolen, must be reported with reasonable dispatch to a peace officer, firearms officer or Chief Firearms Officer. Failing to do so is an offence."
