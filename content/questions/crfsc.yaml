  explanation: "Open sights need you to line up the front and rear sights. Scopes and electronic sights do not require sight alignment."
  source: {handbook_edition: "2014 (5th ed.)", section: "15.4. Aiming handguns", page: "292"}
  review: {reviewed_by: Milan Vrekic, reviewed_on: 2026-11-24, status: reviewed}
- id: crfsc-care-105
  course: crfsc
  topic: care
  type: multiple-choice
  question: "How much firearm maintenance should the average user do?"
  options: ["Basic cleaning and lubrication only", "Full disassembly after each use", "Trigger adjustments as needed", "Any repair at all, given the right tools"]
