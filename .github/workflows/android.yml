name: Android build
# Builds the Android app from the Expo project in app/.
# - A test APK for installing on a phone (keep for 30 days).
# - A Play Store bundle (.aab). It's signed with the upload key when the four ANDROID_UPLOAD_* secrets are set;
#   without them it's signed with a debug key, which Play rejects (fine as a compile check).
# Content is compiled in release mode, so only approved questions, guides and drills ship.
on:
  push:
    branches: [main]
    paths: ['app/**', 'content/**', 'tools/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'content/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: android-build, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      # Each build gets a higher versionCode, so any bundle can be uploaded to Play.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Compile content (approved only)
        run: npm run content
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_UPLOAD_* secrets: the Play bundle is signed with a debug key and can't be uploaded."
          fi
      - name: Build the test APK and the Play bundle
        working-directory: app/android
        env:
          ANDROID_UPLOAD_STORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Show why Gradle failed
        if: failure()
        run: |
          # Surface the Gradle error as annotations, so it's readable from the PR checks.
          f="$RUNNER_TEMP/gradle.log"; [ -f "$f" ] || exit 0
          { grep -n -A14 "What went wrong" "$f" || tail -n 25 "$f"; } | head -n 40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: pal-test-apk-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: pal-test-play-bundle-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
